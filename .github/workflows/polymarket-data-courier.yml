name: Polymarket Public Data Courier

on:
  push:
    branches:
      - courier/polymarket-5m-data
    paths:
      - .github/workflows/polymarket-data-courier.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/polymarket-data-courier.yml
  workflow_dispatch:

jobs:
  courier:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download public CC0 parquet archive
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub[hf_xet]"
          mkdir -p courier/polymarket-5m courier/wheels
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="kachoio/polymarket-5-minute-crypto-up-down-markets",
              repo_type="dataset",
              local_dir="courier/polymarket-5m",
              allow_patterns=["*.parquet", "README.md"],
          )
          PY

      - name: Bundle offline parquet reader and checksums
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest courier/wheels pyarrow==18.1.0
          find courier -type f -print0 | sort -z | xargs -0 sha256sum > courier/SHA256SUMS.txt
          du -sh courier

      - name: Upload BTC ETH SOL bundle
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-data-core
          path: |
            courier/polymarket-5m/btc_*.parquet
            courier/polymarket-5m/eth_*.parquet
            courier/polymarket-5m/sol_*.parquet
            courier/polymarket-5m/README.md
            courier/wheels/*
            courier/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload XRP DOGE BNB HYPE bundle
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-data-alts
          path: |
            courier/polymarket-5m/xrp_*.parquet
            courier/polymarket-5m/doge_*.parquet
            courier/polymarket-5m/bnb_*.parquet
            courier/polymarket-5m/hype_*.parquet
            courier/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
