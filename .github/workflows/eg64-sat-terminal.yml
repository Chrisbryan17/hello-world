name: EG64 lazy SAT terminal-cap search

on:
  push:
    branches:
      - eg64-sat-terminal
    paths:
      - 'eg64-sat/**'
      - '.github/workflows/eg64-sat-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install SAT runtime
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Compile scripts
        run: |
          python3 -m py_compile \
            eg64-sat/lazy_terminal_sat.py \
            eg64-sat/verify_terminal_witness.py
      - name: Known-UNSAT smoke at orders 5 and 7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          for n in 5 7; do
            python3 eg64-sat/lazy_terminal_sat.py \
              --order "$n" \
              --max-seconds 300 \
              --checkpoint "smoke/order-${n}.json" \
              > "smoke/order-${n}.stdout.json"
            python3 - "$n" <<'PY'
          import json
          import sys
          n=int(sys.argv[1])
          data=json.load(open(f"smoke/order-{n}.json"))
          assert data["stats"]["status"] == "unsat", data
          print(f"KNOWN_UNSAT_{n}=PASS")
          PY
          done
      - name: Adversarial witness-verifier rejection
        shell: bash
        run: |
          set -euo pipefail
          cat > smoke/invalid-witness.json <<'JSON'
          {
            "kind": "sat_terminal_cap",
            "order": 5,
            "terminal": 0,
            "edges": [[0,1],[0,2],[1,2],[1,3],[2,4],[3,4],[1,4],[2,3]],
            "doubled_counterexample_order": 10
          }
          JSON
          set +e
          python3 eg64-sat/verify_terminal_witness.py smoke/invalid-witness.json \
            > smoke/adversarial.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'C_4|degree|bridge' smoke/adversarial.log
          echo ADVEVERSARIAL_VERIFIER_REJECTION=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eg64-sat-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: error
          retention-days: 90

  search:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        order: [23, 25, 27, 29, 31]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install SAT runtime
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Run lazy SAT search at order ${{ matrix.order }}
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          order="${{ matrix.order }}"
          set +e
          python3 eg64-sat/lazy_terminal_sat.py \
            --order "$order" \
            --solver cadical195 \
            --max-seconds 3000 \
            --log-every 50 \
            --checkpoint "results/order-${order}.json" \
            --witness-out "results/witness-${order}.json" \
            > "results/order-${order}.stdout.json" \
            2> "results/order-${order}.progress.log"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0)
              test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stats"]["status"])' "results/order-${order}.json")" = "unsat"
              ;;
            10)
              python3 eg64-sat/verify_terminal_witness.py \
                "results/witness-${order}.json" \
                --output "results/independent-verification-${order}.json"
              ;;
            124)
              test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stats"]["status"])' "results/order-${order}.json")" = "timeout"
              ;;
            *)
              echo "unexpected solver exit code $status" >&2
              cat "results/order-${order}.progress.log" >&2 || true
              exit "$status"
              ;;
          esac
          sha256sum results/* > "results/SHA256SUMS-${order}"
      - name: Upload order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg64-sat-terminal-order-${{ matrix.order }}
          path: results/
          if-no-files-found: error
          retention-days: 90
      - name: Flag independently verified witness
        if: steps.solve.outputs.exit_code == '10'
        run: exit 10

  aggregate:
    if: always()
    needs: [smoke, search]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/download-artifact@v4
        with:
          pattern: eg64-sat-terminal-order-*
          path: gathered
      - name: Aggregate exact statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root=Path('gathered')
          records=[]
          witnesses=[]
          for order in (23,25,27,29,31):
              directory=root/f'eg64-sat-terminal-order-{order}'
              checkpoint=directory/f'order-{order}.json'
              assert checkpoint.exists(),checkpoint
              data=json.loads(checkpoint.read_text())
              status=data['stats']['status']
              assert status in {'unsat','timeout','witness'},data
              if status=='witness':
                  proof=directory/f'independent-verification-{order}.json'
                  assert proof.exists()
                  verified=json.loads(proof.read_text())
                  assert verified['verified'] is True
                  witnesses.append({'order':order,'witness':data.get('witness'),'verification':verified})
              records.append({'order':order,**data})
          summary={
              'source_commit':os.environ['GITHUB_SHA'],
              'records':records,
              'verified_witnesses':witnesses,
          }
          out=Path('sat-terminal-summary.json')
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          Path('sat-terminal-summary.sha256').write_text(
              hashlib.sha256(out.read_bytes()).hexdigest()+'  sat-terminal-summary.json\n'
          )
          print(json.dumps({
              'statuses':{str(r['order']):r['stats']['status'] for r in records},
              'verified_witnesses':len(witnesses),
          },sort_keys=True))
          if witnesses:
              raise SystemExit(10)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eg64-sat-terminal-complete-${{ github.run_id }}
          path: |
            sat-terminal-summary.json
            sat-terminal-summary.sha256
            gathered/
            eg64-sat/
          if-no-files-found: error
          retention-days: 90
