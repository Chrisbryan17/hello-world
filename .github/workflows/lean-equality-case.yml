name: Lean equality-case verification

on:
  push:
    branches:
      - lean-equality-case
    paths:
      - 'lean-bridge/**'
      - '.github/workflows/lean-equality-case.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lean-bridge/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Reject proof placeholders
        working-directory: lean-bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              ErdosGyarfas BridgeTest.lean EqualityTest.lean Verify.lean; then
            echo 'Proof placeholder detected.' >&2
            exit 1
          fi
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        working-directory: lean-bridge
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)" >/dev/null
          lean --version
          lake --version
      - name: Resolve Lake dependencies
        working-directory: lean-bridge
        run: lake update >/dev/null
      - name: Fetch mathlib build cache
        working-directory: lean-bridge
        run: lake exe cache get >/dev/null
      - name: Compile theorem library
        id: build
        continue-on-error: true
        working-directory: lean-bridge
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Report theorem build failure
        if: steps.build.outcome == 'failure'
        working-directory: lean-bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -E 's/\x1B\[[0-9;]*[mK]//g' build.log > build-clean.log
          awk '
            /^error:/ {remaining=24}
            /unsolved goals/ {if (remaining < 40) remaining=40}
            /^Some required targets/ {if (remaining < 8) remaining=8}
            remaining > 0 {print; remaining--}
          ' build-clean.log > diagnostics.log
          if [ ! -s diagnostics.log ]; then
            tail -n 100 build-clean.log > diagnostics.log
          fi
          {
            echo 'Lean theorem build failed — exact diagnostics:'
            echo
            echo '```text'
            tail -n 220 diagnostics.log
            echo '```'
          } >comment.md
          gh pr comment 35 --body-file comment.md
          exit 1
      - name: Compile bridge contracts
        working-directory: lean-bridge
        run: |
          lake env lean BridgeTest.lean
          lake env lean EqualityTest.lean
      - name: Audit theorem axiom dependencies
        working-directory: lean-bridge
        shell: bash
        run: |
          set -euo pipefail
          output="$(lake env lean Verify.lean)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'sorryAx'; then
            echo 'sorryAx dependency detected.' >&2
            exit 1
          fi
      - name: Report successful verification
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 35 --body "Lean equality-case verification passed for commit \`${GITHUB_SHA}\`: placeholder scan, \`lake build\`, both contract files, axiom printout, and explicit \`sorryAx\` rejection all succeeded."
