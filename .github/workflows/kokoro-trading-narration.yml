name: Kokoro Trading Narration

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/generate_kokoro.py
      - .github/workflows/kokoro-trading-narration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Kokoro and system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng libsndfile1
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/nazdridoy/kokoro-tts.git@v2.3.1'

      - name: Download Kokoro model assets
        run: |
          curl -fL --retry 5 --retry-delay 2 -o kokoro-v1.0.onnx \
            https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx
          curl -fL --retry 5 --retry-delay 2 -o voices-v1.0.bin \
            https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin
          test -s kokoro-v1.0.onnx
          test -s voices-v1.0.bin

      - name: Generate duration-matched narration
        run: python scripts/generate_kokoro.py

      - name: Verify generated audio
        run: |
          test "$(find kokoro-output -maxdepth 1 -name '*.wav' | wc -l)" -eq 10
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('kokoro-output/manifest.json').read_text())
          assert len(m['scenes']) == 10
          for scene in m['scenes']:
              assert scene['final_duration'] > 10
              assert Path('kokoro-output', scene['file']).stat().st_size > 100000
          print(json.dumps(m, indent=2))
          PY

      - name: Upload Kokoro narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-trading-narration
          path: kokoro-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

