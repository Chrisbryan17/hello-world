            'btc5m_market1691732_2026-03-24_14-50-00_all',
            'btc5m_market1693152_2026-03-24_16-45-00_all',
            'btc5m_market1693913_2026-03-24_18-00-00_all',
          ]
          files=[f'{ep}/{name}' for ep in episodes for name in ('events.parquet','book_levels.parquet')]
          out=Path('trent-multiday-trigger-microstructure')
          def one(path):
              source=hf_hub_download(repo_id=repo,filename=path,repo_type='dataset')
              destination=out/path
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source,destination)
              return path,destination.stat().st_size
          rows=[]
          with ThreadPoolExecutor(max_workers=32) as pool:
              for i,future in enumerate(as_completed([pool.submit(one,p) for p in files]),1):
                  rows.append(future.result())
                  if i%25==0: print('downloaded',i,'of',len(files),flush=True)
          assert len(rows)==len(files),(len(rows),len(files))
          (out/'manifest.json').write_text(json.dumps({'repo':repo,'episodes':episodes,'files':[p for p,_ in rows]},indent=2))
          print('files',len(rows),'bytes',sum(size for _,size in rows))
          PY
          du -sh trent-multiday-trigger-microstructure
      - name: Upload triggered microstructure
        uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-multiday-trigger-microstructure
          path: trent-multiday-trigger-microstructure
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
