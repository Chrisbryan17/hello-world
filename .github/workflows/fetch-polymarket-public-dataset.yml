name: Fetch Multiday Triggered BTC5m Microstructure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-polymarket-public-dataset.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader
        run: python -m pip install --quiet --upgrade huggingface_hub hf_xet
      - name: Download public event and depth files
        run: |
          set -euo pipefail
          mkdir -p trent-multiday-trigger-microstructure
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, shutil
          from huggingface_hub import hf_hub_download
          repo='trentmkelly/polymarket_crypto_derivatives'
          episodes=[
            'btc5m_market1404745_2026-02-22_00-15-00_all',
            'btc5m_market1422830_2026-02-25_01-15-00_all',
            'btc5m_market1422873_2026-02-25_01-30-00_all',
            'btc5m_market1425984_2026-02-25_12-50-00_all',
            'btc5m_market1426554_2026-02-25_14-15-00_all',
            'btc5m_market1426610_2026-02-25_14-30-00_all',
