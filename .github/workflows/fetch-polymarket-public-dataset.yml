name: Fetch Polymarket Public Dataset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-polymarket-public-dataset.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install downloader
        run: python -m pip install --upgrade huggingface_hub hf_xet

      - name: Download public CC0 archive
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='kachoio/polymarket-5-minute-crypto-up-down-markets',
              repo_type='dataset',
              local_dir='polymarket-5m',
              allow_patterns=['*_markets.parquet', '*_ticks.parquet', 'README.md'],
          )
          PY
          find polymarket-5m -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          du -sh polymarket-5m

      - name: Upload public dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-5m-public-dataset
          path: polymarket-5m
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
