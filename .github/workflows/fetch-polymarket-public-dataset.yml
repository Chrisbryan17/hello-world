name: Fetch Independent BTC5m 100ms Steps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-polymarket-public-dataset.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader
        run: python -m pip install --quiet --upgrade huggingface_hub hf_xet
      - name: Download untouched March BTC5m steps
        run: |
          set -euo pipefail
          mkdir -p trent-btc5m-steps
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date
          from pathlib import Path
          import json, os, shutil
          from huggingface_hub import list_repo_files, hf_hub_download

          repo='trentmkelly/polymarket_crypto_derivatives'
          files=list_repo_files(repo, repo_type='dataset')
          start=date(2026,3,15); end=date(2026,3,23)
          selected=[]
          for p in files:
              if not (p.startswith('btc5m_') and p.endswith('/steps.parquet')):
                  continue
              hit=None
              for day in range(15,24):
                  token=f'2026-03-{day:02d}'
                  if token in p:
                      hit=token; break
              if hit is not None:
                  selected.append(p)
          selected=sorted(selected)
          print('selected',len(selected));print('first',selected[:3]);print('last',selected[-3:])
          assert len(selected) >= 2000, len(selected)
          out=Path('trent-btc5m-steps')
          def one(p):
              src=hf_hub_download(repo_id=repo,filename=p,repo_type='dataset')
              episode=p.split('/')[0]
              dst=out/episode/'steps.parquet';dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              return p, dst.stat().st_size
          rows=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              futures=[ex.submit(one,p) for p in selected]
              for i,f in enumerate(as_completed(futures),1):
                  rows.append(f.result())
                  if i%100==0: print('downloaded',i,flush=True)
          (out/'manifest.json').write_text(json.dumps({'repo':repo,'files':[p for p,_ in rows],'count':len(rows)},indent=2))
          print('bytes',sum(s for _,s in rows))
          PY
          find trent-btc5m-steps -name steps.parquet | wc -l
          du -sh trent-btc5m-steps
      - name: Upload independent steps
        uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-steps-2026-03-15-23
          path: trent-btc5m-steps
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
