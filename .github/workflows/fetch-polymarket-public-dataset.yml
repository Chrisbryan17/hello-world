name: Fetch BTC5m Validation Days

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-polymarket-public-dataset.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        day:
          - '2026-02-22'
          - '2026-02-25'
          - '2026-02-28'
          - '2026-03-03'
          - '2026-03-06'
          - '2026-03-09'
          - '2026-03-12'
          - '2026-03-15'
          - '2026-03-18'
          - '2026-03-21'
          - '2026-03-22'
          - '2026-03-24'
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public dataset downloader
        run: python -m pip install --quiet --upgrade huggingface_hub hf_xet
      - name: Download one outcome-agnostic BTC5m day
        env:
          DAY: ${{ matrix.day }}
        run: |
          set -euo pipefail
          mkdir -p "trent-${DAY}"
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, os, shutil
          from huggingface_hub import list_repo_files, hf_hub_download

          repo = 'trentmkelly/polymarket_crypto_derivatives'
          day = os.environ['DAY']
          files = list_repo_files(repo, repo_type='dataset')
          selected = sorted(p for p in files if p.startswith('btc5m_') and f'_{day}_' in p and p.endswith('/steps.parquet'))
          if not selected:
              raise RuntimeError(f'no BTC5m steps found for {day}')
          out = Path(f'trent-{day}')
          def one(path):
              source = hf_hub_download(repo_id=repo, filename=path, repo_type='dataset')
              destination = out / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              return path, destination.stat().st_size
          rows = []
          with ThreadPoolExecutor(max_workers=20) as pool:
              for future in as_completed([pool.submit(one, path) for path in selected]):
                  rows.append(future.result())
          rows.sort()
          (out/'manifest.json').write_text(json.dumps({'repo': repo, 'day': day, 'count': len(rows), 'files': [p for p,_ in rows]}, indent=2))
          print(day, 'files', len(rows), 'bytes', sum(size for _, size in rows))
          PY
          du -sh "trent-${DAY}"
      - name: Upload public BTC5m day
        uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-steps-${{ matrix.day }}
          path: trent-${{ matrix.day }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
