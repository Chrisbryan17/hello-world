name: Fetch Independent Polymarket Microstructure Dataset

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        table: [book_snapshots, pm_trades, slots]
    steps:
      - uses: actions/checkout@v4

      - name: Download independent public parquet table
        env:
          TABLE: ${{ matrix.table }}
        run: |
          mkdir -p "microstructure-${TABLE}"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/api/datasets/kinzikdza/polymarket-updown-microstructure/parquet/${TABLE}/train/0.parquet" \
            --output "microstructure-${TABLE}/${TABLE}.parquet"
          sha256sum "microstructure-${TABLE}/${TABLE}.parquet" | tee "microstructure-${TABLE}/SHA256SUMS"
          ls -lh "microstructure-${TABLE}"

      - name: Upload public table artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-independent-${{ matrix.table }}
          path: microstructure-${{ matrix.table }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
