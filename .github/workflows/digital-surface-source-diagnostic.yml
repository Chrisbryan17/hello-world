name: Digital Surface Source Alignment Diagnostic
on:
  push:
    branches: [digital-surface-ci-20260724]
    paths: [.github/workflows/digital-surface-source-diagnostic.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/digital-surface-source-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact manifest
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface-final-recovered/chunk-* > recovered.b64
          base64 --decode recovered.b64 > recovered.tar.gz
          echo 'ac3cf5f39d71facc9a1e4bc39a9ab05c64ae5ae5137889b74cab64bb540f9a15  recovered.tar.gz' | sha256sum -c -
          mkdir recovered && tar -xzf recovered.tar.gz -C recovered
          echo 'cd6941ea34f6f19477e99be1628f83d7a24a2922a645538ebfe5cae9d3e2c289  recovered/research/digital_surface/obadiaha_source_manifest.json' | sha256sum -c -
      - name: Install stack
        run: python -m pip install pandas==2.2.3 pyarrow==19.0.1 requests==2.32.3
      - name: Diagnose canonical interval
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, traceback
          from pathlib import Path
          import numpy as np, pandas as pd, requests

          report = {'status': 'started'}
          out = Path('diagnostic-results.json')
          def save():
              out.write_text(json.dumps(report, indent=2, default=str))
          try:
              manifest=json.loads(Path('recovered/research/digital_surface/obadiaha_source_manifest.json').read_text())
              items=[x for x in manifest['files'] if x['path'] in {'markets/all.parquet','resolutions/all.parquet'} or x['path'].startswith('crypto_prices/')]
              root=Path('diag'); base=f"https://huggingface.co/datasets/{manifest['repo']}/resolve/{manifest['revision']}"
              def get(item):
                  path=root/item['path']; path.parent.mkdir(parents=True,exist_ok=True)
                  part=path.with_suffix(path.suffix+'.part'); expected=int(item['size'])
                  for attempt in range(8):
                      offset=part.stat().st_size if part.exists() else 0
                      headers={'Range':f'bytes={offset}-'} if offset else {}
                      try:
                          with requests.get(f"{base}/{item['path']}",headers=headers,stream=True,timeout=300) as response:
                              response.raise_for_status(); resume=offset and response.status_code==206
                              with part.open('ab' if resume else 'wb') as handle:
                                  for block in response.iter_content(1<<20):
                                      if block: handle.write(block)
                          if part.stat().st_size==expected:
                              part.replace(path); return path
                      except requests.RequestException as exc:
                          print('retry',item['path'],attempt+1,type(exc).__name__,flush=True)
                      time.sleep(min(2**attempt,8))
                  raise RuntimeError((item['path'],part.stat().st_size if part.exists() else 0,expected))
              paths={x['path']:get(x) for x in items}
              markets=pd.read_parquet(paths['markets/all.parquet'])
              resolutions=pd.read_parquet(paths['resolutions/all.parquet'])
              prices=pd.concat([pd.read_parquet(paths[f'crypto_prices/{d:%Y-%m-%d}.parquet'],columns=['timestamp','asset','open','close']) for d in pd.date_range('2026-03-06','2026-03-19')],ignore_index=True)
              report['market_columns']=markets.columns.tolist(); report['market_dtypes']=markets.dtypes.astype(str).to_dict()
              report['resolution_columns']=resolutions.columns.tolist(); report['resolution_dtypes']=resolutions.dtypes.astype(str).to_dict(); save()

              work=markets.copy(); work['asset']=work['asset'].astype(str).str.upper()
              work=work[(work['asset']=='BTC') & work['market_type'].isin(['crypto_5m','crypto_15m'])].copy()
              work['start_dt']=pd.to_datetime(work['start_time'],utc=True); work['end_dt']=pd.to_datetime(work['end_time'],utc=True)
              work=work[work['start_dt'].between(pd.Timestamp('2026-03-06',tz='UTC'),pd.Timestamp('2026-03-20',tz='UTC'),inclusive='left')]
              resolved=resolutions[['condition_id','outcome']].copy(); resolved['condition_id']=resolved['condition_id'].astype(str); work['condition_id']=work['condition_id'].astype(str)
              work=work.merge(resolved,on='condition_id',how='inner')
              report['rows']=int(len(work)); report['outcomes']={str(k):int(v) for k,v in work['outcome'].value_counts(dropna=False).items()}
              sample_columns=[c for c in ['market_id','slug','question','condition_id','market_type','start_time','end_time','outcome'] if c in work.columns]
              report['sample']=work[sample_columns].head(30).astype(str).to_dict('records'); save()

              gamma_rows=[]; url='https://gamma-api.polymarket.com/markets'; ids=sorted(work['condition_id'].unique())
              for offset in range(0,len(ids),100):
                  batch=ids[offset:offset+100]
                  response=requests.get(url,params={'condition_ids':batch,'closed':'true','limit':len(batch),'offset':0},headers={'User-Agent':'digital-surface-alignment-diagnostic/1.0'},timeout=90)
                  response.raise_for_status()
                  for row in response.json():
                      cid=str(row.get('conditionId') or '')
                      if cid in set(batch): gamma_rows.append({'condition_id':cid,'gamma_slug':str(row.get('slug') or ''),'gamma_question':str(row.get('question') or '')})
              gamma=pd.DataFrame(gamma_rows).drop_duplicates('condition_id',keep='last') if gamma_rows else pd.DataFrame(columns=['condition_id','gamma_slug','gamma_question'])
              work=work.merge(gamma,on='condition_id',how='left')
              report['gamma_rows']=int(len(gamma)); report['gamma_missing']=int(work['gamma_slug'].fillna('').eq('').sum()); save()

              def epoch(value):
                  match=re.search(r'(\d{10,13})(?:\D*)$',str(value))
                  if not match: return pd.NaT
                  number=int(match.group(1)); return pd.to_datetime(number,unit='ms' if number>10**11 else 's',utc=True)
              for source in ['slug','market_id','gamma_slug']:
                  if source in work.columns:
                      work[source+'_dt']=work[source].map(epoch)
              work['duration_s']=work['market_type'].map({'crypto_5m':300,'crypto_15m':900})
              timestamp_candidates={'field_start':work['start_dt'],'field_end_minus_duration':work['end_dt']-pd.to_timedelta(work['duration_s'],unit='s')}
              for source in ['slug','market_id','gamma_slug']:
                  column=source+'_dt'
                  if column in work.columns:
                      timestamp_candidates[source+'_epoch']=work[column]
                      report[source+'_delta_from_field_start_seconds']=(work[column]-work['start_dt']).dt.total_seconds().describe().to_dict()
              save()

              spot=prices[prices['asset'].astype(str).str.upper().eq('BTC')].copy(); spot['dt']=pd.to_datetime(spot['timestamp'],utc=True); spot=spot.sort_values('dt').drop_duplicates('dt',keep='last')
              def values(times,column,offset_ms=0):
                  query=pd.DataFrame({'row':np.arange(len(work)),'q':pd.to_datetime(times,utc=True)+pd.Timedelta(milliseconds=offset_ms)}).dropna().sort_values('q')
                  merged=pd.merge_asof(query,spot[['dt',column]].sort_values('dt'),left_on='q',right_on='dt',direction='backward',tolerance=pd.Timedelta('5min')).sort_values('row')
                  result=np.full(len(work),np.nan); result[merged['row'].astype(int).to_numpy()]=merged[column].to_numpy(); return result
              recorded=work['outcome'].eq('Up').to_numpy(); results=[]
              start_candidates=dict(timestamp_candidates)
              end_candidates={'field_end':work['end_dt']}
              for name,start in start_candidates.items(): end_candidates[name+'_plus_duration']=start+pd.to_timedelta(work['duration_s'],unit='s')
              for start_name,start in start_candidates.items():
                  strike=values(start,'open',0)
                  for end_name,end in end_candidates.items():
                      finals={
                          'close_before_end':values(end,'close',-1),
                          'open_at_end':values(end,'open',0),
                          'close_at_end':values(end,'close',0),
                          'close_previous_minute':values(end,'close',-60000),
                      }
                      for price_mode,final in finals.items():
                          valid=np.isfinite(strike)&np.isfinite(final); predicted=final>=strike
                          agreement=float((predicted[valid]==recorded[valid]).mean()) if valid.any() else None
                          inverse=float((~predicted[valid]==recorded[valid]).mean()) if valid.any() else None
                          results.append({'start':start_name,'end':end_name,'price_mode':price_mode,'agreement':agreement,'inverse_agreement':inverse,'valid':int(valid.sum())})
              results.sort(key=lambda row:-(row['agreement'] if row['agreement'] is not None else -1))
              report['results']=results; report['status']='complete'; save()
              print(json.dumps(report,indent=2,default=str))
          except Exception as exc:
              report['status']='failed'; report['error_type']=type(exc).__name__; report['error']=str(exc); report['traceback']=traceback.format_exc(); save(); print(json.dumps(report,indent=2,default=str)); raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-source-alignment-diagnostic
          path: diagnostic-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce diagnostic completion
        if: steps.diagnostic.outcome == 'failure'
        run: exit 1
