name: Debug Independent Slot Schema

on:
  pull_request:
    branches: [main]
    paths:
      - research-triggers/debug-independent-schema.txt
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas pyarrow huggingface_hub
      - name: Inspect source values and timestamp types
        run: |
          mkdir -p independent-schema-debug
          python - <<'PY' 2>&1 | tee independent-schema-debug/schema.txt
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download
          data=Path('.cache/kinzik-debug')
          snapshot_download(repo_id='kinzikdza/polymarket-updown-microstructure',repo_type='dataset',local_dir=str(data),allow_patterns=['slots.parquet','book_snapshots.parquet'])
          slots=pd.read_parquet(next(data.rglob('slots.parquet')))
          books=pd.read_parquet(next(data.rglob('book_snapshots.parquet')))
          print('SLOTS DTYPES')
          print(slots.dtypes)
          print('SLOTS SAMPLE')
          print(slots.loc[slots.coin.astype(str).str.upper().eq('BTC')].head(5).to_string())
          print('DURATION VALUES',slots.duration.astype(str).value_counts().head(20).to_dict())
          print('RESOLVED VALUES',slots.resolved_side.astype(str).value_counts().head(20).to_dict())
          print('BOOK DTYPES')
          print(books.dtypes)
          print('BOOK SAMPLE')
          print(books.head(5).to_string())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-schema-debug
          path: independent-schema-debug
          retention-days: 2
