name: EG64 stable direct cubic SAT search

on:
  push:
    branches:
      - eg64-sat-cubic-direct
    paths:
      - 'eg64-sat/**'
      - '.github/workflows/eg64-sat-cubic-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install SAT runtime
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Compile scripts
        run: |
          python3 -m py_compile \
            eg64-sat/lazy_terminal_sat.py \
            eg64-sat/lazy_terminal_sat_stable.py \
            eg64-sat/lazy_cubic_sat_stable.py \
            eg64-sat/verify_cubic_witness.py
      - name: Known UNSAT at cubic order 6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          PYTHONPATH=eg64-sat python3 eg64-sat/lazy_cubic_sat_stable.py \
            --order 6 --solver m22 --max-seconds 300 \
            --checkpoint smoke/order-6.json \
            > smoke/order-6.progress.log
          python3 - <<'PY'
          import json
          result=json.load(open('smoke/order-6.json'))
          assert result['stats']['status']=='unsat',result
          print('CUBIC_ORDER6_UNSAT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eg64-cubic-sat-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: error
          retention-days: 90

  search:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        order: [24, 26, 28, 30, 32]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install SAT runtime
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Search bridgeless cubic order ${{ matrix.order }}
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          order="${{ matrix.order }}"
          set +e
          PYTHONPATH=eg64-sat python3 eg64-sat/lazy_cubic_sat_stable.py \
            --order "$order" --solver m22 --max-seconds 3000 \
            --log-every 50 \
            --checkpoint "results/order-${order}.json" \
            --witness-out "results/witness-${order}.json" \
            > "results/order-${order}.progress.log" 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0)
              test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stats"]["status"])' "results/order-${order}.json")" = "unsat"
              ;;
            10)
              python3 eg64-sat/verify_cubic_witness.py \
                "results/witness-${order}.json" \
                --output "results/independent-verification-${order}.json"
              ;;
            124)
              test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stats"]["status"])' "results/order-${order}.json")" = "timeout"
              ;;
            *)
              tail -n 120 "results/order-${order}.progress.log" >&2 || true
              exit "$status"
              ;;
          esac
          sha256sum results/* > "results/SHA256SUMS-${order}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eg64-cubic-sat-order-${{ matrix.order }}
          path: results/
          if-no-files-found: error
          retention-days: 90
      - name: Flag independently verified counterexample
        if: steps.solve.outputs.exit_code == '10'
        run: exit 10

  aggregate:
    if: always()
    needs: [smoke, search]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/download-artifact@v4
        with:
          pattern: eg64-cubic-sat-order-*
          path: gathered
      - name: Aggregate exact direct-search states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          records=[]
          witnesses=[]
          for order in (24,26,28,30,32):
              directory=Path('gathered')/f'eg64-cubic-sat-order-{order}'
              checkpoint=directory/f'order-{order}.json'
              assert checkpoint.exists(),checkpoint
              result=json.loads(checkpoint.read_text())
              status=result['stats']['status']
              assert status in {'unsat','timeout','witness'},result
              if status=='witness':
                  proof=directory/f'independent-verification-{order}.json'
                  assert proof.exists()
                  verification=json.loads(proof.read_text())
                  assert verification['verified'] is True
                  witnesses.append({'order':order,'witness':result.get('witness'),'verification':verification})
              records.append({'order':order,**result})
          summary={
              'source_commit':os.environ['GITHUB_SHA'],
              'class':'connected bridgeless simple cubic graphs',
              'orders':[24,26,28,30,32],
              'records':records,
              'verified_witnesses':witnesses,
          }
          out=Path('cubic-sat-summary.json')
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          Path('cubic-sat-summary.sha256').write_text(
              hashlib.sha256(out.read_bytes()).hexdigest()+'  cubic-sat-summary.json\n'
          )
          print(json.dumps({
              'statuses':{str(record['order']):record['stats']['status'] for record in records},
              'verified_witnesses':len(witnesses),
          },sort_keys=True))
          if witnesses:
              raise SystemExit(10)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eg64-cubic-sat-complete-${{ github.run_id }}
          path: |
            cubic-sat-summary.json
            cubic-sat-summary.sha256
            gathered/
            eg64-sat/
          if-no-files-found: error
          retention-days: 90
