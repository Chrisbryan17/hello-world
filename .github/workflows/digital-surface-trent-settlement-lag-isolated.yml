name: Digital Surface Trent Settlement Lag Isolated

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-trent-settlement-lag-isolated.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub==0.34.4 pandas==2.2.3 pyarrow==19.0.1 numpy==2.2.6
      - name: Test first distinct update after one-second anchor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trent-settlement-lag-controls/files
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          import numpy as np,pandas as pd
          from huggingface_hub import HfApi,hf_hub_download
          OUT=Path('trent-settlement-lag-controls');REPO='trentmkelly/polymarket_crypto_derivatives'
          official={1772755200:70888.56020229173,1772755800:70938.78987331357,1772756400:71017.35732058427,1772757000:70917.12393639315,1772757600:70939.64770257795,1772758200:70927.42075552029,1772758800:70987.03812254872,1772759400:70905.73111679299,1772760000:70860.5774747142,1772760600:70463.60742361813,1772761200:71004.69651270959,1772761800:71161.7874144923}
          def tok(e):return datetime.fromtimestamp(e,tz=timezone.utc).strftime('%Y-%m-%d_%H-%M-%S')
          wanted={}
          for e in official:
              wanted[tok(e-300)]=('previous',e);wanted[tok(e)]=('current',e)
          selected={e:{} for e in official}
          for item in HfApi().list_repo_tree(REPO,repo_type='dataset',recursive=True,expand=False):
              p=getattr(item,'path','')
              if not p.startswith('btc5m_') or not p.endswith('/steps.parquet'):continue
              for t,(side,e) in wanted.items():
                  if t in p:selected[e][side]=p;break
          def norm(s):
              x=pd.to_numeric(s,errors='coerce').to_numpy(float);f=x[np.isfinite(x)];m=float(np.nanmedian(np.abs(f))) if len(f) else 0
              return x/1e9 if m>1e17 else x/1e6 if m>1e14 else x/1e3 if m>1e11 else x
          rows=[]
          for e,want in sorted(official.items()):
              stream=[];files=[]
              for side,p in selected[e].items():
                  local=Path(hf_hub_download(REPO,p,repo_type='dataset',local_dir=OUT/'files'))
                  d=pd.read_parquet(local,columns=['ts','chainlink_price']);ts=norm(d.ts);px=pd.to_numeric(d.chainlink_price,errors='coerce').to_numpy(float)
                  ok=np.isfinite(ts)&np.isfinite(px)&(px>0);stream.extend(zip(ts[ok].tolist(),px[ok].tolist()));files.append({'side':side,'path':p,'sha256':hashlib.sha256(local.read_bytes()).hexdigest()})
              stream=sorted(set((float(t),float(p)) for t,p in stream));ts=np.array([x[0] for x in stream]);px=np.array([x[1] for x in stream])
              anchor_time=e+1.0;prior=np.where(ts<anchor_time)[0];anchor=float(px[prior[-1]]) if len(prior) else None
              result=None
              if anchor is not None:
                  cand=np.where((ts>=anchor_time)&(~np.isclose(px,anchor,rtol=0,atol=1e-9)))[0]
                  if len(cand):
                      i=int(cand[0]);result={'ts':float(ts[i]),'delta_s':float(ts[i]-e),'price':float(px[i]),'abs_error':float(abs(px[i]-want))}
              rows.append({'boundary_epoch':e,'official_ptb':want,'anchor_time':anchor_time,'anchor_price':anchor,'settlement_update':result,'files':files})
          covered=[r for r in rows if r['settlement_update']];exact=[r for r in covered if r['settlement_update']['abs_error']<=0.01]
          decision={'controls':len(rows),'covered':len(covered),'exact_to_cent':len(exact),'coverage':len(covered)/len(rows),'agreement':len(exact)/len(covered) if covered else 0,'mismatches':[r for r in covered if r['settlement_update']['abs_error']>0.01],'missing':[r for r in rows if not r['settlement_update']],'rule':'first Chainlink price change at or after boundary + 1.0 seconds relative to the last value before that anchor','settlement_grade':len(covered)==len(rows) and len(exact)==len(rows),'gap_values_admitted':False}
          (OUT/'controls.json').write_text(json.dumps(rows,indent=2));(OUT/'decision.json').write_text(json.dumps(decision,indent=2));print(json.dumps(decision,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-trent-settlement-lag-isolated
          path: trent-settlement-lag-controls/
          if-no-files-found: error
          retention-days: 30
