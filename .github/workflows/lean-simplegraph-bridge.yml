name: Lean SimpleGraph bridge verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lean-bridge/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Reject proof placeholders
        working-directory: lean-bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' ErdosGyarfas BridgeTest.lean Verify.lean; then
            echo 'Proof placeholder detected.' >&2
            exit 1
          fi
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        working-directory: lean-bridge
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)" >/dev/null
          lean --version
          lake --version
      - name: Resolve Lake dependencies
        working-directory: lean-bridge
        run: lake update >/dev/null
      - name: Fetch mathlib build cache
        working-directory: lean-bridge
        run: lake exe cache get >/dev/null
      - name: Compile theorem library
        id: build
        working-directory: lean-bridge
        shell: bash
        run: |
          set +e
          lake build >build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 160 build.log >build-tail.log
          exit 0
      - name: Report build failure on pull request
        if: steps.build.outputs.status != '0'
        working-directory: lean-bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Lean build failed. Compiler tail:'
            echo
            echo '```text'
            cat build-tail.log
            echo '```'
          } >comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
          exit 1
      - name: Compile bridge contract
        working-directory: lean-bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          lake env lean BridgeTest.lean >contract.log 2>&1
          status=$?
          cat contract.log
          if [ "$status" -ne 0 ]; then
            {
              echo 'Lean bridge contract failed:'
              echo
              echo '```text'
              cat contract.log
              echo '```'
            } >contract-comment.md
            gh pr comment "$PR_NUMBER" --body-file contract-comment.md
            exit "$status"
          fi
      - name: Audit theorem axiom dependencies
        working-directory: lean-bridge
        shell: bash
        run: |
          set -euo pipefail
          output="$(lake env lean Verify.lean)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'sorryAx'; then
            echo 'sorryAx dependency detected.' >&2
            exit 1
          fi
