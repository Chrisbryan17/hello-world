name: EG64 audit HoG terminal cap 50547

on:
  push:
    branches:
      - eg64-terminal-cap-census
    paths:
      - '.github/workflows/eg64-hog-50547.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Fetch exact graph record and output formats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          curl -fsSL -D results/graph-api.headers \
            https://houseofgraphs.org/api/graphs/50547 \
            -o results/graph-api-50547.json
          curl -fsSL -D results/formats-api.headers \
            https://houseofgraphs.org/api/graph_output_formats \
            -o results/graph-output-formats.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('results/graph-api-50547.json').read_text())
          formats=json.loads(Path('results/graph-output-formats.json').read_text())
          options=formats if isinstance(formats,list) else formats.get('content',formats.get('entity',formats))
          if not isinstance(options,list):
              raise SystemExit(f'unexpected format payload: {type(options).__name__}')
          g6=[item for item in options if str(item.get('extension','')).lower()=='g6']
          if not g6:
              raise SystemExit('Graph6 output format absent')
          format_name=g6[0]['name']
          Path('results/download-request.json').write_text(
              json.dumps({'graphId':50547,'format':format_name,'searchConditions':None},sort_keys=True)+'\n'
          )
          summary={
              'graph_id':50547,
              'format_name':format_name,
              'graph_payload_top_level_keys':sorted(graph.keys()) if isinstance(graph,dict) else [],
              'format_record':g6[0],
          }
          Path('results/api-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Download exact graph6 record through production API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -D results/download-api.headers \
            -H 'Content-Type: application/json' \
            --data-binary @results/download-request.json \
            https://houseofgraphs.org/api/download_graph \
            -o results/download-50547.bin
          python3 - <<'PY'
          from pathlib import Path
          data=Path('results/download-50547.bin').read_bytes().strip()
          if data.startswith(b'>>graph6<<'):
              data=data[len(b'>>graph6<<'):].strip()
          lines=[line.strip() for line in data.splitlines() if line.strip()]
          if len(lines)!=1:
              raise SystemExit(f'expected one graph6 record, received {len(lines)} lines')
          record=lines[0]
          if any(byte<63 or byte>126 for byte in record):
              raise SystemExit('download is not printable graph6')
          if record[0]-63 != 59:
              raise SystemExit(f'expected order 59 graph6, first value={record[0]-63}')
          Path('results/graph-50547.g6').write_bytes(record+b'\n')
          print(record.decode('ascii'))
          PY
          sha256sum results/graph-50547.g6 > results/graph-50547.g6.sha256

      - name: Run exact terminal-cap cycle test
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 eg64-terminal/terminal_cap_census.py \
            --order 59 \
            --expected 1 \
            --witness-out results/witness-50547.json \
            < results/graph-50547.g6 \
            > results/cycle-audit-50547.json
          status=$?
          set -e
          if [[ "$status" == "10" ]]; then
            python3 eg64-terminal/verify_terminal_cap.py \
              results/witness-50547.json \
              --output results/independent-verification-50547.json
            echo 'counterexample=1' >> "$GITHUB_OUTPUT"
          else
            [[ "$status" == "0" ]]
            echo 'counterexample=0' >> "$GITHUB_OUTPUT"
          fi
          cat results/cycle-audit-50547.json
          sha256sum results/* > results/SHA256SUMS.tmp
          grep -v 'SHA256SUMS' results/SHA256SUMS.tmp > results/SHA256SUMS
          rm results/SHA256SUMS.tmp

      - name: Upload candidate audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg64-hog-50547-audit-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 90

      - name: Flag independently verified counterexample
        if: steps.audit.outputs.counterexample == '1'
        run: exit 10
