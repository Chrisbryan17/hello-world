name: Polymarket Month Backtest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scratch/extract_polymarket.py
      - uses: actions/upload-artifact@v4
        with:
          name: polymarket-month-data
          path: output/
          if-no-files-found: error
          retention-days: 3
