name: Compact Trent BTC5m Public Dataset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-trent-btc5m.yml
  workflow_dispatch:

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet huggingface_hub hf_xet pyarrow pandas numpy
      - name: Download and compact BTC5m public episodes
        run: |
          cat > /tmp/compact.py <<'PY'
          from __future__ import annotations
          from huggingface_hub import snapshot_download
          from pathlib import Path
          from datetime import datetime, timezone
          import re, json, math
          import numpy as np, pandas as pd

          REPO='trentmkelly/polymarket_crypto_derivatives'
          ROOT=Path('trent-btc5m')
          OBS=(10,20,30,45,60)
          LATS=(100,250,500,1000)
          snapshot_download(REPO,repo_type='dataset',local_dir=str(ROOT),allow_patterns=['btc5m_*/steps.parquet'],max_workers=16)
          files=sorted(ROOT.glob('btc5m_*/steps.parquet'))
          print('downloaded',len(files),flush=True)
          pat=re.compile(r'btc5m_market(\d+)_(\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2})_all')
          rows=[]; failures={}
          def last_at(ts, vals, target, max_stale=2000):
              i=np.searchsorted(ts,target,side='right')-1
              if i<0 or target-ts[i]>max_stale:return np.nan
              return vals[i]
          def first_at(ts,target,max_gap=300):
              i=np.searchsorted(ts,target,side='left')
              if i>=len(ts) or ts[i]-target>max_gap:return -1
              return i
          for n,p in enumerate(files,1):
              try:
                  m=pat.fullmatch(p.parent.name)
                  if not m:continue
                  market_id,start_s=m.groups(); start_dt=datetime.strptime(start_s,'%Y-%m-%d_%H-%M-%S').replace(tzinfo=timezone.utc); start_ms=int(start_dt.timestamp()*1000)
                  d=pd.read_parquet(p).sort_values('ts')
                  d=d[(d.ts>=start_ms-2000)&(d.ts<=start_ms+310000)]
                  if len(d)<100:continue
                  c=d[['ts','chainlink_price']].dropna(); ct=c.ts.to_numpy(np.int64);cv=c.chainlink_price.to_numpy(float)
                  io=np.searchsorted(ct,start_ms,side='left'); ic=np.searchsorted(ct,start_ms+305000,side='right')-1
                  if io>=len(ct) or ct[io]>start_ms+5000 or ic<0 or ct[ic]<start_ms+295000:continue
                  copen=float(cv[io]);cclose=float(cv[ic])
                  if not (copen>0 and cclose>0) or abs(cclose-copen)<1e-12:continue
                  y=int(cclose>copen)
                  b=d[['ts','binance_price']].dropna();bt=b.ts.to_numpy(np.int64);bv=b.binance_price.to_numpy(float)
                  bo=last_at(bt,bv,start_ms+1500,max_stale=3000)
                  if not np.isfinite(bo) or bo<=0:continue
                  sec=np.arange(0,61,dtype=np.int64); targets=start_ms+sec*1000
                  path=np.array([last_at(bt,bv,int(t),max_stale=2000) for t in targets],float)
                  if not np.isfinite(path[0]):path[0]=bo
                  for j in range(1,len(path)):
                      if not np.isfinite(path[j]):path[j]=path[j-1]
                  if not np.isfinite(path).all():continue
                  lr=np.diff(np.log(np.maximum(path,1e-12)),prepend=np.log(max(path[0],1e-12)))
                  ts=d.ts.to_numpy(np.int64)
                  for obs in OBS:
                      def mom(k):
                          j=max(0,obs-k);return math.log(path[obs]/path[j])*1e4
                      def vol(k):
                          j=max(1,obs-k+1);return float(np.std(lr[j:obs+1])*1e4)
                      base={'episode':p.parent.name,'market_id':market_id,'market_start':start_dt.isoformat(),'market_start_ms':start_ms,'obs':obs,'y':y,'chainlink_open':copen,'chainlink_close':cclose,'binance_open':float(path[0]),'binance_now':float(path[obs]),'BTC_ret':math.log(path[obs]/path[0])*1e4,'BTC_mom5':mom(5),'BTC_mom10':mom(10),'BTC_vol10':vol(10),'BTC_vol30':vol(min(30,obs)),'BTC_range':(np.max(path[:obs+1])-np.min(path[:obs+1]))/path[0]*1e4}
                      for lat in LATS:
                          target=start_ms+obs*1000+lat;i=first_at(ts,target,300)
                          if i<0:continue
                          r=d.iloc[i]
                          vals=[r.up_best_bid,r.up_best_ask,r.down_best_bid,r.down_best_ask]
                          if not all(np.isfinite(vals)):continue
                          ub,ua,db,da=map(float,vals)
                          if not(0<ub<ua<1 and 0<db<da<1):continue
                          rows.append(dict(base,latency_ms=lat,entry_ts=int(r.ts),entry_gap_ms=int(r.ts-target),up_bid=ub,up_ask=ua,down_bid=db,down_ask=da,up_mid=float(r.up_mid),down_mid=float(r.down_mid),up_spread=float(r.up_spread),down_spread=float(r.down_spread),up_bid_size=float(r.up_bid_size_total),up_ask_size=float(r.up_ask_size_total),up_imbalance=float(r.up_imbalance),down_bid_size=float(r.down_bid_size_total),down_ask_size=float(r.down_ask_size_total),down_imbalance=float(r.down_imbalance)))
              except Exception as e:
                  failures[type(e).__name__]=failures.get(type(e).__name__,0)+1
              if n%500==0:print('processed',n,'rows',len(rows),'fail',failures,flush=True)
          out=pd.DataFrame(rows)
          out.to_parquet('trent_btc5m_compact.parquet',index=False,compression='zstd')
          manifest={'episodes_found':len(files),'rows':len(out),'markets':int(out.episode.nunique()) if len(out) else 0,'start':str(out.market_start.min()) if len(out) else None,'end':str(out.market_start.max()) if len(out) else None,'failures':failures,'obs_counts':out.obs.value_counts().sort_index().to_dict() if len(out) else {},'latency_counts':out.latency_ms.value_counts().sort_index().to_dict() if len(out) else {}}
          open('trent_btc5m_manifest.json','w').write(json.dumps(manifest,indent=2));print(json.dumps(manifest,indent=2),flush=True)
          PY
          python /tmp/compact.py
      - uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-compact
          path: |
            trent_btc5m_compact.parquet
            trent_btc5m_manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
