name: Kokoro narration synthesis

on:
  push:
    paths:
      - ".github/workflows/kokoro-narration.yml"
  pull_request:
    paths:
      - ".github/workflows/kokoro-narration.yml"
      - "kokoro_narration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsndfile1 libportaudio2 ffmpeg

      - name: Install nazdridoy/kokoro-tts
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "git+https://github.com/nazdridoy/kokoro-tts.git@main"
          python - <<'PY'
          import importlib.metadata
          import kokoro_onnx
          print("kokoro-tts", importlib.metadata.version("kokoro-tts"))
          print("kokoro-onnx", importlib.metadata.version("kokoro-onnx"))
          print("kokoro_onnx module", kokoro_onnx.__file__)
          PY

      - name: Download Kokoro v1.0 model and voices
        run: |
          curl --location --fail --retry 5 --retry-all-errors \
            --output kokoro-v1.0.onnx \
            https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx
          curl --location --fail --retry 5 --retry-all-errors \
            --output voices-v1.0.bin \
            https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin
          ls -lh kokoro-v1.0.onnx voices-v1.0.bin
          sha256sum kokoro-v1.0.onnx voices-v1.0.bin

      - name: Synthesize all chapters
        run: python kokoro_narration/synthesize.py

      - name: Validate generated WAV files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import soundfile as sf

          root = Path("kokoro-output")
          manifest = json.loads((root / "kokoro-manifest.json").read_text())
          scenes = manifest["scenes"]
          assert len(scenes) == 10, len(scenes)
          for scene in scenes:
              path = root / scene["file"]
              info = sf.info(path)
              assert info.samplerate == 24000, (path, info.samplerate)
              assert info.channels == 1, (path, info.channels)
              assert info.frames > 0, path
              assert abs(info.duration - scene["duration_seconds"]) < 0.01
              print(f"{path.name}: {info.duration:.3f}s, {info.samplerate} Hz, {info.subtype}")
          PY

      - name: Upload Kokoro narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-trading-narration
          path: kokoro-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
