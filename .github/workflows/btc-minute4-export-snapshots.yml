name: BTC Minute4 Export Snapshots

on:
  pull_request:
    branches: [main]
    paths:
      - research-triggers/btc-minute4-export-snapshots.txt
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy pyarrow scikit-learn huggingface_hub hf_xet
      - name: Reuse frozen panel builder and export snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/btc-minute4-yeet-analysis.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(source) if "cat > /tmp/analyze.py <<'PY'" in l)+1
          end=next(i for i in range(start,len(source)) if source[i].strip()=='PY')
          code='\n'.join((line[10:] if line.startswith('          ') else line) for line in source[start:end])+'\n'
          code=code.replace("OUT=Path('btc-minute4-yeet-results')", "OUT=Path('btc-minute4-snapshot-export')")
          anchor="base.to_csv(OUT/'market_features.csv',index=False); grid.to_csv(OUT/'simple_exit_grid.csv',index=False);"
          replacement="snap.to_parquet(OUT/'snapshots.parquet',index=False,compression='zstd'); snap.to_csv(OUT/'snapshots.csv.gz',index=False,compression='gzip'); base.to_csv(OUT/'market_features.csv',index=False); grid.to_csv(OUT/'simple_exit_grid.csv',index=False);"
          if anchor not in code: raise RuntimeError('snapshot export anchor missing')
          code=code.replace(anchor,replacement)
          Path('/tmp/export_snapshots.py').write_text(code)
          PY
          python /tmp/export_snapshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-minute4-snapshot-export
          path: btc-minute4-snapshot-export
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
