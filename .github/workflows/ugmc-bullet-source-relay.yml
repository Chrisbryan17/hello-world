name: UGMC Clean Bullet Source Relay

on:
  push:
    branches:
      - ugmc-pybullet-relay-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-clean-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Bullet source
        uses: actions/checkout@v4
        with:
          repository: bulletphysics/bullet3
          ref: 63c4d67e337017f9d8b298c900e9aabdb69296e7
          path: bullet3
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and package a clean shallow clone
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C bullet3 rev-parse HEAD)" = "63c4d67e337017f9d8b298c900e9aabdb69296e7"
          git -C bullet3 remote set-url origin https://github.com/bulletphysics/bullet3.git
          git -C bullet3 status --porcelain=v1
          mkdir -p out
          tar -I 'gzip -1' -cf out/bullet3-pinned-clean-shallow-clone.tar.gz bullet3
          sha256sum out/bullet3-pinned-clean-shallow-clone.tar.gz > out/SHA256SUMS.txt
          du -sh bullet3 out/*

      - name: Upload clean pinned clone
        uses: actions/upload-artifact@v4
        with:
          name: bullet3-pinned-clean-shallow-clone
          path: |
            out/bullet3-pinned-clean-shallow-clone.tar.gz
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
