name: Digital Surface Official Outcome Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-official-outcome-recovery.yml
      - scripts/digital_surface_official_outcome_recovery.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_ARTIFACT_ID: '8608755070'
      BASELINE_SHA256: e049437fcdeafa433dc46cfc61ffdddfdbad64ec13534d8bf07879637f55bcba
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned verification stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.3 \
            pyarrow==19.0.1 \
            'httpx[http2]==0.28.1'

      - name: Compile and regression-test parsers
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts/digital_surface_official_outcome_recovery.py
          PYTHONPATH=scripts python - <<'PY'
          import json
          from digital_surface_official_outcome_recovery import gamma_outcome, html_outcome
          payload = json.dumps({
              'id':'e',
              'markets':[{
                  'slug':'x',
                  'conditionId':'c',
                  'outcomes':'["Up","Down"]',
                  'outcomePrices':'["1","0"]',
              }],
          }).encode()
          assert gamma_outcome(payload, 'x') == ('Up', 'e', 'c')
          assert html_outcome(b'The final outcome was "Down".', 'x') == 'Down'
          print('official outcome parser regression checks passed')
          PY

      - name: Download and verify frozen baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            --output baseline.zip
          echo "${BASELINE_SHA256}  baseline.zip" | sha256sum -c -
          mkdir baseline
          unzip -q baseline.zip -d baseline

      - name: Recover official outcomes and verify every immutable label
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p official-outcome-audit
          python scripts/digital_surface_official_outcome_recovery.py \
            --baseline-dir baseline \
            --baseline-zip baseline.zip \
            --output-dir official-outcome-audit \
            2>&1 | tee official-outcome-audit/audit.log

      - name: Stabilize and verify internal checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('official-outcome-audit')
          decision = root / 'official_outcome_decision.json'
          if not decision.exists():
              print('decision absent; preserving failure evidence')
              raise SystemExit(0)
          checksums = {}
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name not in {'SHA256SUMS.json', 'audit.log'}:
                  checksums[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256SUMS.json').write_text(
              json.dumps(checksums, indent=2, sort_keys=True), encoding='utf-8'
          )
          expected = json.loads((root / 'SHA256SUMS.json').read_text())
          for name, want in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert got == want, (name, got, want)
          print(f'verified {len(expected)} stable official-outcome files')
          PY

      - name: Show source decision
        if: always()
        run: |
          cat official-outcome-audit/official_outcome_decision.json || true
          tail -200 official-outcome-audit/audit.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-official-outcome-audit
          path: official-outcome-audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce unchanged 99 percent source gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path('official-outcome-audit/official_outcome_decision.json').read_text())
          assert decision['coverage'] == 1.0, decision
          assert decision['agreement'] >= decision['required_agreement'], decision
          assert decision['gate_passed'] is True, decision
          assert decision['contracts_filtered'] is False, decision
          assert decision['signals_changed'] is False, decision
          assert decision['thresholds_changed'] is False, decision
          assert decision['execution_assumptions_changed'] is False, decision
          assert decision['validation_chronology_changed'] is False, decision
          assert decision['strike_source'].startswith('causal Binance'), decision
          print('official outcome source gate passed without changing strategy geometry')
          PY
