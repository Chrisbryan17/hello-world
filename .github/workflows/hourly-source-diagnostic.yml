name: Hourly Source Diagnostic

on:
  push:
    branches: [polymarket-multiasset-frequency-20260723]
    paths: [.github/workflows/hourly-source-diagnostic.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/hourly-source-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Inspect pinned hourly CSV files
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee hourly-source-diagnostic.log
          import hashlib, json, requests
          from pathlib import Path
          repo='Solal9/polymarket-crypto-updown-binary'
          rev='c17800caa413042941bbd8a9f266b23b6f5f8ed4'
          files=['polymarket_btc_1h_snapshots.csv','polymarket_btc_1h_orderbook.csv']
          out={}
          for fn in files:
            url=f'https://huggingface.co/datasets/{repo}/resolve/{rev}/{fn}'
            h=requests.head(url,allow_redirects=True,timeout=120)
            rec={'url':url,'status':h.status_code,'headers':dict(h.headers)}
            print('\n###',fn,'HEAD',h.status_code,'length',h.headers.get('content-length'))
            r=requests.get(url,headers={'Range':'bytes=0-262143'},stream=True,timeout=180)
            data=b''
            for chunk in r.iter_content(65536):
              data+=chunk
              if len(data)>=262144: break
            text=data.decode('utf-8','replace')
            rec['get_status']=r.status_code; rec['sample_sha256']=hashlib.sha256(data).hexdigest(); rec['sample_lines']=text.splitlines()[:25]
            print('\n'.join(rec['sample_lines'][:8]))
            out[fn]=rec
          Path('hourly-source-diagnostic.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hourly-source-diagnostic
          path: |
            hourly-source-diagnostic.json
            hourly-source-diagnostic.log
          retention-days: 30
