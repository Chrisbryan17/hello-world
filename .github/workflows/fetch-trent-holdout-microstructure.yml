name: Fetch Trent Frozen Holdout Microstructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader
        run: python -m pip install --quiet huggingface_hub hf_xet
      - name: Download exact sealed holdout episodes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo = 'trentmkelly/polymarket_crypto_derivatives'
          episodes = [
              'btc5m_market1411589_2026-02-23_01-10-00_all',
              'btc5m_market1411597_2026-02-23_01-15-00_all',
              'btc5m_market1411600_2026-02-23_01-20-00_all',
              'btc5m_market1411644_2026-02-23_01-50-00_all',
              'btc5m_market1414387_2026-02-23_14-35-00_all',
              'btc5m_market1415216_2026-02-23_17-15-00_all',
              'btc5m_market1415973_2026-02-23_20-15-00_all',
              'btc5m_market1431891_2026-02-26_03-00-00_all',
              'btc5m_market1435340_2026-02-26_14-35-00_all',
              'btc5m_market1467233_2026-03-01_16-50-00_all',
              'btc5m_market1467389_2026-03-01_17-10-00_all',
              'btc5m_market1470151_2026-03-01_22-15-00_all',
              'btc5m_market1470227_2026-03-01_22-35-00_all',
              'btc5m_market1499184_2026-03-05_14-05-00_all',
              'btc5m_market1499274_2026-03-05_14-30-00_all',
              'btc5m_market1536728_2026-03-10_08-05-00_all',
              'btc5m_market1537101_2026-03-10_11-05-00_all',
              'btc5m_market1537505_2026-03-10_13-30-00_all',
              'btc5m_market1539715_2026-03-10_16-00-00_all',
              'btc5m_market1540066_2026-03-10_16-35-00_all',
              'btc5m_market1540730_2026-03-10_17-30-00_all',
              'btc5m_market1594733_2026-03-16_04-35-00_all',
              'btc5m_market1597584_2026-03-16_12-25-00_all',
              'btc5m_market1599618_2026-03-16_16-55-00_all',
              'btc5m_market1601959_2026-03-16_22-25-00_all',
              'btc5m_market1602415_2026-03-16_23-20-00_all',
              'btc5m_market1639535_2026-03-19_13-35-00_all',
              'btc5m_market1639675_2026-03-19_14-05-00_all',
              'btc5m_market1649554_2026-03-20_10-25-00_all',
          ]
          out = Path('trent-frozen-holdout-microstructure')
          for episode in episodes:
              target = out / episode
              target.mkdir(parents=True, exist_ok=True)
              for filename in ('book_levels.parquet', 'events.parquet'):
                  source = hf_hub_download(repo_id=repo, repo_type='dataset', filename=f'{episode}/{filename}')
                  shutil.copy2(source, target / filename)
              print(episode)
          (out / 'manifest.txt').write_text('\n'.join(episodes) + '\n')
          PY
          find trent-frozen-holdout-microstructure -type f -printf '%p %s bytes\n' | sort
          sha256sum trent-frozen-holdout-microstructure/*/*.parquet > trent-frozen-holdout-microstructure/SHA256SUMS
      - name: Upload holdout microstructure
        uses: actions/upload-artifact@v4
        with:
          name: trent-frozen-holdout-microstructure
          path: trent-frozen-holdout-microstructure
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
