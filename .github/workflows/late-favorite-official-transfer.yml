name: Late Favorite Official Outcome Transfer

on:
  push:
    branches: [digital-surface-live-readiness-20260725]
    paths:
      - .github/workflows/late-favorite-official-transfer.yml
      - ci_payload/digital-surface-live-readiness/late-favorite-official-transfer-source/**
  pull_request:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/late-favorite-official-transfer.yml
      - ci_payload/digital-surface-live-readiness/late-favorite-official-transfer-source/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '17'
  PYTHONUNBUFFERED: '1'

jobs:
  red-terminal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest==8.3.5
      - name: Verify RED terminal parser contract
        env:
          PYTHONPATH: ci_payload/digital-surface-live-readiness/late-favorite-official-transfer-source
        run: pytest -q ci_payload/digital-surface-live-readiness/late-favorite-official-transfer-source/test_official_transfer.py
