name: NDO2 encrypted source transport

on:
  push:
    branches:
      - transport/ndo2-source-20260828

permissions:
  contents: read
  issues: write

env:
  MAILBOX_ISSUE: "81"
  TARGET_REPO: "Chrisbryan17/NDO2"
  TARGET_COMMIT: "421a1543a837dd0cd91a363cc78bae4b77eb30ff"
  TARGET_TREE: "58daba316eeb8b1c0c811a52d83dbbf105d84767"

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Establish encrypted mailbox and transfer exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$work/private.pem" >/dev/null 2>&1
          openssl pkey -in "$work/private.pem" -pubout -out "$work/public.pem"
          public_key_b64="$(base64 -w0 "$work/public.pem")"
          key_prefix="NDO2_BRIDGE_PUBKEY:${GITHUB_RUN_ID}:"
          payload_prefix="NDO2_BRIDGE_PAYLOAD:${GITHUB_RUN_ID}:"

          jq -nc --arg body "${key_prefix}${public_key_b64}" '{body:$body}' > "$work/comment.json"
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${MAILBOX_ISSUE}/comments" \
            --data-binary @"$work/comment.json" >/dev/null

          payload=""
          for _ in $(seq 1 180); do
            comments="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${MAILBOX_ISSUE}/comments?per_page=100")"
            payload="$(jq -r --arg p "$payload_prefix" '[.[] | .body | select(startswith($p))] | last // empty' <<<"$comments")"
            if [[ -n "$payload" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$payload" ]]; then
            echo "Encrypted payload was not received before timeout." >&2
            exit 20
          fi

          printf '%s' "${payload#${payload_prefix}}" | base64 -d > "$work/payload.bin"
          openssl pkeyutl -decrypt \
            -inkey "$work/private.pem" \
            -in "$work/payload.bin" \
            -out "$work/payload.json" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          raw_token="$(jq -er '.raw_token' "$work/payload.json")"
          archive_password="$(jq -er '.archive_password' "$work/payload.json")"
          commit="$(jq -er '.commit' "$work/payload.json")"
          tree="$(jq -er '.tree' "$work/payload.json")"

          [[ "$commit" == "$TARGET_COMMIT" ]] || { echo "Commit identity mismatch" >&2; exit 21; }
          [[ "$tree" == "$TARGET_TREE" ]] || { echo "Tree identity mismatch" >&2; exit 22; }

          archive="$work/source.tar.gz"
          ok=0
          candidates=(
            "https://codeload.github.com/${TARGET_REPO}/tar.gz/${TARGET_COMMIT}?token=${raw_token}"
            "https://github.com/${TARGET_REPO}/archive/${TARGET_COMMIT}.tar.gz?token=${raw_token}"
            "https://api.github.com/repos/${TARGET_REPO}/tarball/${TARGET_COMMIT}?token=${raw_token}"
          )

          for candidate in "${candidates[@]}"; do
            rm -f "$archive"
            if curl -fLsS --retry 1 --connect-timeout 20 --max-time 180 "$candidate" -o "$archive" \
              && tar -tzf "$archive" >/dev/null 2>&1; then
              ok=1
              break
            fi
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "Temporary raw token did not authorize a commit archive on tested GitHub archive endpoints." >&2
            exit 23
          fi

          mkdir "$work/src"
          tar -xzf "$archive" -C "$work/src" --strip-components=1
          git -C "$work/src" init -q
          git -C "$work/src" add -A
          actual_tree="$(git -C "$work/src" write-tree)"
          if [[ "$actual_tree" != "$TARGET_TREE" ]]; then
            echo "Archive extracted tree mismatch: expected ${TARGET_TREE}, got ${actual_tree}" >&2
            exit 24
          fi

          cipher="$GITHUB_WORKSPACE/ndo2-${TARGET_COMMIT}.tar.gz.enc"
          metadata="$GITHUB_WORKSPACE/ndo2-${TARGET_COMMIT}.metadata.txt"
          ARCHIVE_PASSWORD="$archive_password" openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -pass env:ARCHIVE_PASSWORD \
            -in "$archive" \
            -out "$cipher"

          cipher_sha="$(sha256sum "$cipher" | awk '{print $1}')"
          {
            echo "target_repo=${TARGET_REPO}"
            echo "target_commit=${TARGET_COMMIT}"
            echo "target_tree=${TARGET_TREE}"
            echo "cipher_sha256=${cipher_sha}"
            echo "verification=git_write_tree_match"
          } > "$metadata"

          jq -nc --arg body "NDO2_BRIDGE_VERIFIED:${GITHUB_RUN_ID}:${TARGET_COMMIT}:${TARGET_TREE}:${cipher_sha}" '{body:$body}' > "$work/verified.json"
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${MAILBOX_ISSUE}/comments" \
            --data-binary @"$work/verified.json" >/dev/null

      - name: Upload encrypted exact-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndo2-exact-source-421a1543-encrypted
          path: |
            ndo2-421a1543a837dd0cd91a363cc78bae4b77eb30ff.tar.gz.enc
            ndo2-421a1543a837dd0cd91a363cc78bae4b77eb30ff.metadata.txt
          if-no-files-found: error
          retention-days: 1
