name: Inspect Aliplayer BTC5m Schema

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet duckdb pandas numpy
      - name: Inspect schemas and bounded samples through HTTP range reads
        run: |
          python - <<'PY' > aliplayer-btc5m-schema.txt
          import duckdb

          base = 'https://huggingface.co/datasets/aliplayer1/polymarket-crypto-updown/resolve/main/'
          files = {
              'markets': 'data/markets.parquet',
              'orderbook_history': 'data/orderbook/crypto=BTC/timeframe=5-minute/part-0.parquet',
              'ticks_history': 'data/ticks/crypto=BTC/timeframe=5-minute/part-0.parquet',
              'spot_history': 'data/spot_prices/part-0.parquet',
              'orderbook_append': 'data/orderbook/crypto=BTC/timeframe=5-minute/part-ws-1777225328480-000.parquet',
              'ticks_append': 'data/ticks/crypto=BTC/timeframe=5-minute/part-ws-1777223813373-000.parquet',
          }
          con = duckdb.connect()
          con.execute('INSTALL httpfs; LOAD httpfs;')
          con.execute("SET http_timeout=300000")
          for name, path in files.items():
              url = base + path
              print('\n###', name, path)
              try:
                  schema = con.execute(f"DESCRIBE SELECT * FROM read_parquet('{url}')").fetchdf()
                  print(schema.to_string(index=False))
                  sample = con.execute(f"SELECT * FROM read_parquet('{url}') LIMIT 3").fetchdf()
                  print('SAMPLE')
                  print(sample.to_json(orient='records', date_format='iso'))
                  cols = list(sample.columns)
                  candidates = [c for c in cols if any(k in c.lower() for k in ('time','timestamp','created','start','end','date'))]
                  for c in candidates:
                      try:
                          r = con.execute(f"SELECT min(\"{c}\"), max(\"{c}\"), count(*) FROM read_parquet('{url}')").fetchone()
                          print('RANGE', c, r)
                      except Exception as exc:
                          print('RANGE_ERROR', c, repr(exc))
              except Exception as exc:
                  print('ERROR', repr(exc))
          PY
          cat aliplayer-btc5m-schema.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aliplayer-btc5m-schema
          path: aliplayer-btc5m-schema.txt
          retention-days: 1
          if-no-files-found: error
