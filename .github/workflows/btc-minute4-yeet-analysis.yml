name: BTC Minute4 Loss Detector Research

on:
  pull_request:
    branches: [main]
    paths:
      - research-triggers/btc-minute4-yeet.txt
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '17'
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy pyarrow scikit-learn huggingface_hub hf_xet
      - name: Run optimized causal loss-detector study
        run: |
          cat > /tmp/analyze.py <<'PY'
          from __future__ import annotations

          import hashlib, json, math
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import pyarrow.parquet as pq
          from huggingface_hub import snapshot_download
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler

          OUT=Path('btc-minute4-yeet-results'); DATA=Path('.cache/kacho-btc')
          OUT.mkdir(parents=True,exist_ok=True); DATA.mkdir(parents=True,exist_ok=True)

          def fee(p):
              p=np.clip(np.asarray(p,float),0,1)
              return 0.07*p*(1-p)
          def norm_out(v):
              s=str(v).strip().lower()
              if s in {'up','yes','1','true'}: return 1
              if s in {'down','no','0','false'}: return 0
              return None
          assert abs(float(fee(.5))-.0175)<1e-12

          snapshot_download(repo_id='kachoio/polymarket-5-minute-crypto-up-down-markets',repo_type='dataset',local_dir=str(DATA),allow_patterns=['btc_markets.parquet','btc_ticks.parquet'])
          mp=next(DATA.rglob('btc_markets.parquet')); tp=next(DATA.rglob('btc_ticks.parquet'))
          m=pd.read_parquet(mp)
          cid='condition_id' if 'condition_id' in m else 'conditionId'
          sc=next(c for c in ['market_start','start_time','startDate','start'] if c in m)
          oc=next(c for c in ['outcome','result','winner'] if c in m)
          m=m[[cid,sc,oc]].rename(columns={cid:'condition_id',sc:'market_start',oc:'outcome'})
          m.market_start=pd.to_datetime(m.market_start,utc=True,errors='coerce'); m['y_up']=m.outcome.map(norm_out)
          m=m.dropna(subset=['condition_id','market_start','y_up']).drop_duplicates('condition_id'); m.y_up=m.y_up.astype(int)
          m['start_epoch']=(m.market_start.astype('int64')//1_000_000_000).astype('int64')
          schema=pq.ParquetFile(tp).schema.names
          cols=[c for c in ['condition_id','t','bu','au','bd','ad','du','dd'] if c in schema]
          x=pd.read_parquet(tp,columns=cols).merge(m[['condition_id','start_epoch']],on='condition_id',how='inner')
          x['rel_t']=pd.to_numeric(x.t,errors='coerce')-x.start_epoch
          x=x.loc[x.rel_t.between(205,299)].copy(); x.rel_t=x.rel_t.round().astype(int)
          x=x.sort_values(['condition_id','rel_t','t']).drop_duplicates(['condition_id','rel_t'],keep='last')
          for c in ['bu','au','bd','ad','du','dd']:
              if c in x: x[c]=pd.to_numeric(x[c],errors='coerce')
          meta=m.set_index('condition_id')[['market_start','y_up']]

          records=[]; snapshot_rows=[]; paths={}
          for condition,g in x.groupby('condition_id',sort=False):
              if condition not in meta.index: continue
              g=g.sort_values('rel_t').copy()
              sane=(g.bu.gt(0)&g.au.lt(1)&g.bd.gt(0)&g.ad.lt(1)&g.bu.le(g.au)&g.bd.le(g.ad))
              g=g.loc[sane]
              sigs=g.loc[g.rel_t<=240]; ents=g.loc[g.rel_t>=241]
              if sigs.empty or ents.empty: continue
              sig=sigs.iloc[-1]; ent=ents.iloc[0]
              mu=(sig.bu+sig.au)/2; md=(sig.bd+sig.ad)/2; up=bool(mu>=md)
              leader=float(mu if up else md); ask=float(ent.au if up else ent.ad); bid=float(ent.bu if up else ent.bd)
              won=int(int(meta.loc[condition,'y_up'])==int(up))
              path=g.loc[g.rel_t>=int(ent.rel_t)].copy()
              path['fav_bid']=path.bu if up else path.bd; path['fav_ask']=path.au if up else path.ad
              path['fav_mid']=(path.fav_bid+path.fav_ask)/2; path['fav_spread']=path.fav_ask-path.fav_bid
              path=path.loc[path.fav_bid.gt(0)&path.fav_bid.le(path.fav_ask)&path.fav_ask.lt(1)]
              if path.empty: continue
              times=path.rel_t.to_numpy(int); bids=path.fav_bid.to_numpy(float); mids=path.fav_mid.to_numpy(float); spreads=path.fav_spread.to_numpy(float)
              paths[str(condition)]=(times,bids,mids,spreads)
              hist=sigs.copy(); hist['fav_mid']=(hist.bu+hist.au)/2 if up else (hist.bd+hist.ad)/2
              ht=hist.rel_t.to_numpy(int); hm=hist.fav_mid.to_numpy(float)
              def lag(sec):
                  k=np.searchsorted(ht,240-sec,side='right')-1
                  return hm[k] if k>=0 else np.nan
              moms={f'mom{s}':leader-lag(s) for s in [1,3,5,10,20,30]}
              t10=hm[ht>=230]; t30=hm[ht>=210]
              vol10=float(np.std(np.diff(t10))) if len(t10)>2 else 0.; vol30=float(np.std(np.diff(t30))) if len(t30)>2 else 0.
              dd10=float(np.max(t10)-t10[-1]) if len(t10) else 0.; dd30=float(np.max(t30)-t30[-1]) if len(t30) else 0.
              du=float(sig.du) if 'du' in sig and np.isfinite(sig.du) else np.nan; dd=float(sig.dd) if 'dd' in sig and np.isfinite(sig.dd) else np.nan
              imb=(du-dd)/(du+dd) if np.isfinite(du+dd) and du+dd>0 else 0.; imb=imb if up else -imb
              records.append({'condition_id':str(condition),'market_start':meta.loc[condition,'market_start'],'side':'Up' if up else 'Down','side_up':int(up),'won':won,
                              'leader_mid':leader,'signal_spread':float((sig.au-sig.bu) if up else (sig.ad-sig.bd)),'entry_t':int(ent.rel_t),'entry_ask':ask,'entry_bid':bid,
                              'entry_spread':ask-bid,'vol10':vol10,'vol30':vol30,'drawdown10':dd10,'drawdown30':dd30,'depth_imb':imb,**moms})
              peak=-np.inf
              for j,tt in enumerate(times):
                  if tt>295: break
                  peak=max(peak,mids[j])
                  def pm(sec):
                      k=np.searchsorted(times,tt-sec,side='right')-1
                      return mids[k] if k>=0 else mids[j]
                  snapshot_rows.append({'condition_id':str(condition),'market_start':meta.loc[condition,'market_start'],'t':int(tt),'loss':1-won,'side_up':int(up),
                                        'entry_ask':ask,'entry_leader_mid':leader,'entry_spread':ask-bid,'current_bid':bids[j],'current_mid':mids[j],'current_spread':spreads[j],
                                        'bid_from_entry':bids[j]-ask,'mid_from_entry':mids[j]-leader,'mom1_live':mids[j]-pm(1),'mom3_live':mids[j]-pm(3),
                                        'mom5_live':mids[j]-pm(5),'mom10_live':mids[j]-pm(10),'trail_drawdown':peak-mids[j],'seconds_left':300-int(tt),
                                        'vol10':vol10,'mom5_entry':moms['mom5'],'mom10_entry':moms['mom10'],'drawdown10_entry':dd10,'depth_imb':imb})

          base=pd.DataFrame(records).sort_values('market_start').reset_index(drop=True); snap=pd.DataFrame(snapshot_rows).sort_values(['market_start','condition_id','t'])
          if len(base)<1000: raise RuntimeError(f'insufficient markets {len(base)}')
          maxd=base.market_start.max().floor('D'); hold=maxd-pd.Timedelta(days=6); val=hold-pd.Timedelta(days=7)
          base['split']=np.where(base.market_start>=hold,'holdout',np.where(base.market_start>=val,'validation','train'))
          splitmap=base.set_index('condition_id').split; snap['split']=snap.condition_id.map(splitmap)

          ENTRY_SLIP=.01; EXIT_SLIP=.01
          def ecost(p):
              q=float(np.clip(p+ENTRY_SLIP,.01,.99)); return q+float(fee(q))
          def enet(p):
              q=float(np.clip(p-EXIT_SLIP,0,.99)); return max(0.,q-float(fee(q)))
          def execute_index(times,trigger):
              k=int(np.searchsorted(times,trigger+1,side='left')); return k if k<len(times) else None
          def sim(row,kind='time',stop=.1,trail=.08,floor=.6,time_exit=295,model_trigger=None):
              times,bids,mids,_=paths[str(row.condition_id)]; cost=ecost(row.entry_ask); peak=-np.inf; trig=None; reason=None
              for j,tt in enumerate(times):
                  peak=max(peak,mids[j])
                  if tt<=row.entry_t: continue
                  if model_trigger is not None and tt>=model_trigger: trig=int(tt); reason='model'; break
                  if kind in {'stop','combined'} and bids[j]<=row.entry_ask-stop: trig=int(tt); reason='hard_stop'; break
                  if kind in {'trail','combined'} and mids[j]<=peak-trail: trig=int(tt); reason='trailing_stop'; break
                  if kind in {'floor','combined'} and mids[j]<=floor: trig=int(tt); reason='mid_floor'; break
                  if time_exit is not None and tt>=time_exit: trig=int(tt); reason='time_exit'; break
              if trig is not None:
                  k=execute_index(times,trig)
                  if k is not None: return enet(bids[k])/cost,int(times[k]),reason
              return ((1/cost) if row.won else 0.),300,'resolution'
          def metrics(mult):
              a=np.asarray(mult,float); logs=np.log(np.maximum(a,1e-300)); bank=90.; peak=90.; maxdd=0.
              for z in a:
                  bank*=z; peak=max(peak,bank); maxdd=max(maxdd,1-bank/peak if peak else 1)
                  if bank==0: break
              return {'n':len(a),'mean_multiple':float(a.mean()),'positive_rate':float((a>1).mean()),'mean_log_multiple':float(logs.mean()),'terminal_90':float(bank),'max_drawdown':float(maxdd)}

          # Small theory-led grid; every rule exits before resolution unless data disappear.
          configs=[]
          for te in [270,280,290,295]: configs.append(('time',None,None,None,te))
          for s in [.03,.05,.08,.10,.15,.20]: configs.append(('stop',s,None,None,295))
          for tr in [.03,.05,.08,.10,.15]: configs.append(('trail',None,tr,None,295))
          for s in [.05,.08,.10,.15]:
              for fl in [.50,.55,.60,.65]: configs.append(('combined',s,None,fl,295))
          grid=[]; mult_cache={}
          for cfg in configs:
              kind,st,tr,fl,te=cfg; allm=[]
              for r in base.itertuples(index=False): allm.append(sim(r,kind,st or .1,tr or .08,fl or .6,te)[0])
              allm=np.asarray(allm); mult_cache[cfg]=allm
              row={'kind':kind,'stop':st,'trail':tr,'mid_floor':fl,'time_exit':te}
              for sp in ['train','validation','holdout']:
                  mask=base.split.eq(sp).to_numpy(); row.update({f'{sp}_{k}':v for k,v in metrics(allm[mask]).items()})
              grid.append(row)
          grid=pd.DataFrame(grid); ok=grid.loc[(grid.train_mean_multiple>1)&(grid.validation_mean_multiple>1)&(grid.validation_n>=500)].copy()
          pool=ok if len(ok) else grid; pool['score']=pool.train_mean_multiple+pool.validation_mean_multiple-.25*pool.validation_max_drawdown
          best=pool.sort_values('score',ascending=False).iloc[0]
          bestcfg=(best.kind,None if pd.isna(best.stop) else float(best.stop),None if pd.isna(best.trail) else float(best.trail),None if pd.isna(best.mid_floor) else float(best.mid_floor),int(best.time_exit))
          bestmult=mult_cache[bestcfg]

          pre_features=['leader_mid','signal_spread','entry_spread','mom1','mom3','mom5','mom10','mom20','mom30','vol10','vol30','drawdown10','drawdown30','depth_imb','side_up']
          train=base.loc[base.split=='train'].dropna(subset=pre_features); va=base.loc[base.split=='validation'].dropna(subset=pre_features); ho=base.loc[base.split=='holdout'].dropna(subset=pre_features)
          pre=Pipeline([('z',StandardScaler()),('lr',LogisticRegression(max_iter=1000,class_weight='balanced',C=.5))]); pre.fit(train[pre_features],1-train.won)
          pre_auc={}
          for name,f in [('train',train),('validation',va),('holdout',ho)]:
              p=pre.predict_proba(f[pre_features])[:,1]; base.loc[f.index,'pre_loss_prob']=p; pre_auc[name]=float(roc_auc_score(1-f.won,p))

          live_features=['current_bid','current_mid','current_spread','bid_from_entry','mid_from_entry','mom1_live','mom3_live','mom5_live','mom10_live','trail_drawdown','seconds_left','entry_ask','entry_leader_mid','entry_spread','side_up','vol10','mom5_entry','mom10_entry','drawdown10_entry','depth_imb']
          st=snap.loc[snap.split=='train'].dropna(subset=live_features); sv=snap.loc[snap.split=='validation'].dropna(subset=live_features); sh=snap.loc[snap.split=='holdout'].dropna(subset=live_features)
          model=Pipeline([('z',StandardScaler()),('lr',LogisticRegression(max_iter=1000,class_weight='balanced',C=.35))]); model.fit(st[live_features],st.loss)
          live_auc={}
          for name,f in [('train',st),('validation',sv),('holdout',sh)]:
              p=model.predict_proba(f[live_features])[:,1]; snap.loc[f.index,'loss_prob']=p; live_auc[name]=float(roc_auc_score(f.loss,p))
          sg={cid:g[['t','loss_prob']].dropna().sort_values('t') for cid,g in snap.groupby('condition_id',sort=False)}
          model_grid=[]; model_mult={}
          for th in [.25,.35,.45,.55,.65,.75,.85]:
              for cons in [1,2,3]:
                  allm=[]; caught=[]; reasons=[]
                  for r in base.itertuples(index=False):
                      g=sg.get(str(r.condition_id)); trig=None; run=0
                      if g is not None:
                          for q in g.itertuples(index=False):
                              run=run+1 if q.loss_prob>=th else 0
                              if run>=cons: trig=int(q.t); break
                      z,_,reason=sim(r,'time',time_exit=295,model_trigger=trig); allm.append(z); reasons.append(reason); caught.append(int((not r.won) and reason!='resolution'))
                  a=np.asarray(allm); model_mult[(th,cons)]=a; row={'threshold':th,'consecutive':cons}
                  for sp in ['train','validation','holdout']:
                      mask=base.split.eq(sp).to_numpy(); met=metrics(a[mask]); row.update({f'{sp}_{k}':v for k,v in met.items()}); row[f'{sp}_caught_losses']=int(np.asarray(caught)[mask].sum()); row[f'{sp}_losses']=int(((1-base.won).to_numpy()[mask]).sum())
                  model_grid.append(row)
          model_grid=pd.DataFrame(model_grid); mok=model_grid.loc[(model_grid.train_mean_multiple>1)&(model_grid.validation_mean_multiple>1)].copy(); mpool=mok if len(mok) else model_grid
          mpool['score']=mpool.train_mean_multiple+mpool.validation_mean_multiple-.25*mpool.validation_max_drawdown
          bm=mpool.sort_values('score',ascending=False).iloc[0]; bmmult=model_mult[(float(bm.threshold),int(bm.consecutive))]

          veto=[]
          for cut in [.05,.10,.15,.20,.25,.30,.40,.50]:
              row={'pre_loss_prob_max':cut}
              for sp in ['train','validation','holdout']:
                  mask=(base.split.eq(sp)&base.pre_loss_prob.le(cut)).to_numpy(); row.update({f'{sp}_{k}':v for k,v in metrics(bestmult[mask]).items()}) if mask.sum() else None
              veto.append(row)
          veto=pd.DataFrame(veto)

          # First thirty trades: literal hold vs best simple exit vs sequential detector.
          path=[]; banks={'hold':90.,'simple':90.,'model':90.}; th=float(bm.threshold); cons=int(bm.consecutive)
          for i,r in enumerate(base.head(30).itertuples(index=False),1):
              hm=(1/ecost(r.entry_ask)) if r.won else 0.; sm,stt,sr=sim(r,bestcfg[0],bestcfg[1] or .1,bestcfg[2] or .08,bestcfg[3] or .6,bestcfg[4])
              g=sg.get(str(r.condition_id)); trig=None; run=0
              if g is not None:
                  for q in g.itertuples(index=False):
                      run=run+1 if q.loss_prob>=th else 0
                      if run>=cons: trig=int(q.t); break
              mm,mtt,mr=sim(r,'time',time_exit=295,model_trigger=trig)
              banks['hold']*=hm; banks['simple']*=sm; banks['model']*=mm
              path.append({'trade':i,'market_start':r.market_start,'side':r.side,'won':r.won,'entry_ask':r.entry_ask,'hold_multiple':hm,'hold_bankroll':banks['hold'],
                           'simple_multiple':sm,'simple_exit_t':stt,'simple_reason':sr,'simple_bankroll':banks['simple'],'model_multiple':mm,'model_exit_t':mtt,'model_reason':mr,'model_bankroll':banks['model']})

          base.to_csv(OUT/'market_features.csv',index=False); grid.to_csv(OUT/'simple_exit_grid.csv',index=False); model_grid.to_csv(OUT/'sequential_model_grid.csv',index=False); veto.to_csv(OUT/'pre_entry_veto_grid.csv',index=False); pd.DataFrame(path).to_csv(OUT/'first_30_all_in_paths.csv',index=False)
          best.to_frame().T.to_csv(OUT/'best_simple_exit.csv',index=False); bm.to_frame().T.to_csv(OUT/'best_sequential_model.csv',index=False)
          summary={'markets':len(base),'snapshots':len(snap),'date_min':str(base.market_start.min()),'date_max':str(base.market_start.max()),'validation_start':str(val),'holdout_start':str(hold),
                   'execution':{'entry_second':241,'entry_slippage_cents':1,'trigger_to_sell_delay_seconds':1,'exit_slippage_cents':1,'forced_exit_second':295},'pre_entry_auc':pre_auc,'sequential_auc':live_auc,
                   'best_simple_exit':best.replace({np.nan:None}).to_dict(),'best_sequential_model':bm.replace({np.nan:None}).to_dict(),'first_30_final_bankrolls':banks}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,default=str)); print(json.dumps(summary,indent=2,default=str))
          files=[]
          for p in sorted(OUT.iterdir()):
              if p.is_file(): files.append({'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (OUT/'MANIFEST.json').write_text(json.dumps(files,indent=2))
          PY
          python /tmp/analyze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-minute4-loss-detector-results
          path: btc-minute4-yeet-results
          retention-days: 2
          if-no-files-found: error
