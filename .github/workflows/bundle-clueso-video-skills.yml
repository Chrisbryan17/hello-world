name: Bundle Clueso Video Skills

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bundle-clueso-video-skills.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify all skills
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/clueso-ai/skills.git source

          mapfile -t skill_dirs < <(find source/skills -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/SKILL.md' ';' -print | sort)
          skill_count="${#skill_dirs[@]}"
          echo "Found ${skill_count} skills"
          if [ "$skill_count" -ne 90 ]; then
            echo "Expected exactly 90 skills, found ${skill_count}" >&2
            printf '%s\n' "${skill_dirs[@]}" >&2
            exit 1
          fi

          mkdir -p package/clueso-video-skills-90/skills
          for dir in "${skill_dirs[@]}"; do
            cp -a "$dir" package/clueso-video-skills-90/skills/
          done
          cp source/README.md package/clueso-video-skills-90/
          cp source/LICENSE package/clueso-video-skills-90/

          source_commit="$(git -C source rev-parse HEAD)"
          source_date="$(git -C source show -s --format=%cI HEAD)"
          source_subject="$(git -C source show -s --format=%s HEAD)"

          cat > package/clueso-video-skills-90/INSTALL.md <<'EOF'
          # Installation

          Original installer command:

          ```bash
          npx skills add clueso-ai/skills
          ```

          This archive contains all 90 skill directories from `skills/`, plus the upstream README and Apache-2.0 license.
          EOF

          python3 - <<'PY'
          import csv, hashlib, json, pathlib, re, subprocess

          root = pathlib.Path('package/clueso-video-skills-90')
          source = pathlib.Path('source')
          skills = []
          for skill_dir in sorted((root / 'skills').iterdir()):
              skill_file = skill_dir / 'SKILL.md'
              text = skill_file.read_text(encoding='utf-8')
              name = skill_dir.name
              description = ''
              if text.startswith('---'):
                  front = text.split('---', 2)[1]
                  for line in front.splitlines():
                      if line.startswith('name:'):
                          name = line.split(':', 1)[1].strip().strip('"\'')
                      elif line.startswith('description:'):
                          description = line.split(':', 1)[1].strip().strip('"\'')
              files = []
              for path in sorted(p for p in skill_dir.rglob('*') if p.is_file()):
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  files.append({
                      'path': str(path.relative_to(root)),
                      'bytes': path.stat().st_size,
                      'sha256': digest,
                  })
              skills.append({
                  'directory': skill_dir.name,
                  'name': name,
                  'description': description,
                  'file_count': len(files),
                  'files': files,
              })

          commit = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          commit_date = subprocess.check_output(['git', '-C', str(source), 'show', '-s', '--format=%cI', 'HEAD'], text=True).strip()
          subject = subprocess.check_output(['git', '-C', str(source), 'show', '-s', '--format=%s', 'HEAD'], text=True).strip()
          manifest = {
              'source_repository': 'https://github.com/clueso-ai/skills',
              'installer_command': 'npx skills add clueso-ai/skills',
              'source_commit': commit,
              'source_commit_date': commit_date,
              'source_commit_subject': subject,
              'skill_count': len(skills),
              'skills': skills,
          }
          (root / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          with (root / 'MANIFEST.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['number', 'directory', 'name', 'description', 'file_count'])
              for i, skill in enumerate(skills, 1):
                  w.writerow([i, skill['directory'], skill['name'], skill['description'], skill['file_count']])
          (root / 'SOURCE.json').write_text(json.dumps({
              'repository': manifest['source_repository'],
              'commit': commit,
              'commit_date': commit_date,
              'commit_subject': subject,
              'skill_count': len(skills),
          }, indent=2) + '\n', encoding='utf-8')
          print(f'Validated and manifested {len(skills)} skills at commit {commit}')
          PY

          (cd package && zip -r -9 ../clueso-video-skills-90.zip clueso-video-skills-90 >/dev/null)
          sha256sum clueso-video-skills-90.zip > clueso-video-skills-90.zip.sha256
          cp package/clueso-video-skills-90/MANIFEST.json ./clueso-video-skills-90-manifest.json
          cp package/clueso-video-skills-90/MANIFEST.csv ./clueso-video-skills-90-manifest.csv

          unzip -t clueso-video-skills-90.zip
          test "$(unzip -Z1 clueso-video-skills-90.zip | grep -E '^clueso-video-skills-90/skills/[^/]+/SKILL\.md$' | wc -l)" -eq 90

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: clueso-video-skills-90
          path: |
            clueso-video-skills-90.zip
            clueso-video-skills-90.zip.sha256
            clueso-video-skills-90-manifest.json
            clueso-video-skills-90-manifest.csv
          if-no-files-found: error
          retention-days: 1
