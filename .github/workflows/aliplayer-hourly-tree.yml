name: Aliplayer Hourly Tree

on:
  push:
    branches: [polymarket-multiasset-frequency-20260723]
    paths: [.github/workflows/aliplayer-hourly-tree.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/aliplayer-hourly-tree.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: List pinned hourly partitions
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee aliplayer-hourly-tree.log
          import json, requests
          from pathlib import Path
          repo='aliplayer1/polymarket-crypto-updown'; rev='ba1ad37cbcdd720cced20f1cdc97c2cf347cad6c'
          r=requests.get(f'https://huggingface.co/api/datasets/{repo}',params={'blobs':'true'},timeout=180)
          print('status',r.status_code,r.url); r.raise_for_status(); info=r.json()
          print('reported revision',info.get('sha')); assert info.get('sha')==rev,(info.get('sha'),rev)
          siblings=info.get('siblings',[])
          prefixes=('data/orderbook/crypto=BTC/timeframe=1-hour/','data/orderbook/crypto=ETH/timeframe=1-hour/')
          exact=('data/markets.parquet','data/spot_prices.parquet','data/prices.parquet','data/ticks.parquet')
          selected=[]
          for x in siblings:
            path=x.get('rfilename','')
            if path.startswith(prefixes) or path in exact:
              selected.append({'path':path,'size':x.get('size'),'blob_id':x.get('blobId'),'lfs':x.get('lfs')})
          out={'repo':repo,'revision':rev,'selected':selected,'all_sibling_count':len(siblings)}
          print('siblings',len(siblings),'selected',len(selected))
          print('selected bytes',sum((x.get('size') or (x.get('lfs') or {}).get('size') or 0) for x in selected))
          for x in selected: print(x)
          Path('aliplayer-hourly-tree.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aliplayer-hourly-tree
          path: |
            aliplayer-hourly-tree.json
            aliplayer-hourly-tree.log
          retention-days: 30
