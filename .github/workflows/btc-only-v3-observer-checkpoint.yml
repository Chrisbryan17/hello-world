name: BTC-Only v3 Observer Checkpoint

on:
  push:
    branches: [digital-surface-live-readiness-20260725]
    paths:
      - .github/workflows/btc-only-v3-observer-checkpoint.yml
      - ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3/**
  pull_request:
    branches: [digital-surface-ci-20260724, digital-surface-live-readiness-20260725]
    paths:
      - .github/workflows/btc-only-v3-observer-checkpoint.yml
      - ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3/**
  workflow_dispatch:

concurrency:
  group: btc-only-v3-observer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '17'
  PYTHONUNBUFFERED: '1'

jobs:
  observer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test stack
        run: python -m pip install requests==2.32.4 pytest==8.3.5

      - name: Compile observer, collector, resolution, and CLI sources
        shell: bash
        run: |
          set -euo pipefail
          root=ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3
          python -m py_compile \
            "$root/source/late_favorite_v3.py" \
            "$root/source/capture_policy.py" \
            "$root/collector/public_collector.py" \
            "$root/collector/resolution.py" \
            "$root/collector/cli.py" \
            "$root/tests/test_late_favorite_v3.py" \
            "$root/tests/test_capture_policy.py" \
            "$root/tests/test_public_collector.py" \
            "$root/tests/test_resolution.py" \
            "$root/tests/test_cli.py"

      - name: Pass exactly 24 behavior contracts
        shell: bash
        env:
          PYTHONPATH: ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3/source:ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3/collector
        run: |
          set -euo pipefail
          root=ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3
          pytest --collect-only -q "$root/tests" | tee /tmp/collect.txt
          grep -Eq '^24 tests collected' /tmp/collect.txt
          pytest -q "$root/tests"

      - name: Verify frozen policies and contamination cutoffs
        shell: bash
        env:
          PYTHONPATH: ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3/source:ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3/collector
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from capture_policy import load_capture_policy
          from late_favorite_v3 import load_frozen_policy

          root = Path('ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3')
          frozen_source_paths = [
              root / 'source/late_favorite_v3.py',
              root / 'source/capture_policy.py',
              root / 'collector/public_collector.py',
              root / 'collector/resolution.py',
          ]
          combined = hashlib.sha256()
          source_hashes = {}
          for path in frozen_source_paths:
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              source_hashes[str(path.relative_to(root))] = digest
              combined.update(path.name.encode() + b'\0' + raw)
          combined_source_sha256 = combined.hexdigest()
          cli_path = root / 'collector/cli.py'
          cli_sha256 = hashlib.sha256(cli_path.read_bytes()).hexdigest()
          source_hashes[str(cli_path.relative_to(root))] = cli_sha256

          trading = load_frozen_policy(
              root / 'CANDIDATE_SPEC.json',
              root / 'FREEZE_MANIFEST.json',
              source_sha256=combined_source_sha256,
          )
          capture = load_capture_policy(
              root / 'CAPTURE_POLICY.json',
              root / 'CAPTURE_FREEZE_MANIFEST.json',
          )
          assert trading.policy_sha256 == '82b923b0d4034d801156b77a213db6084be719f27491478247e5354ea93e92ba'
          assert capture.capture_policy_sha256 == '888810ae61a0ab3e067c68850faeba5f2709a57bb69ef0c2ad708e128b311edc'
          assert capture.valid_market_open_after_epoch_seconds > trading.valid_market_open_after_epoch_seconds
          assert capture.signal_target_offset_ms == 210_000
          assert capture.arrival_target_offset_ms == 211_000
          assert capture.max_request_start_lateness_ms == 250
          assert capture.max_request_duration_ms == 1_000
          assert capture.max_book_age_at_request_completion_ms == 2_000

          verification = {
              'candidate': 'late_favorite_btc_only_v3_prospective_shadow',
              'tests_collected': 24,
              'candidate_policy_sha256': trading.policy_sha256,
              'capture_policy_sha256': capture.capture_policy_sha256,
              'candidate_cutoff_epoch_seconds': trading.valid_market_open_after_epoch_seconds,
              'capture_cutoff_epoch_seconds': capture.valid_market_open_after_epoch_seconds,
              'combined_frozen_source_sha256': combined_source_sha256,
              'cli_sha256': cli_sha256,
              'source_files_sha256': source_hashes,
              'public_endpoints': [
                  'GET https://gamma-api.polymarket.com/markets/slug/{slug}',
                  'POST https://clob.polymarket.com/books',
              ],
              'official_resolution': 'Gamma closed binary terminal outcome',
              'commands': ['capture', 'resolve'],
              'credentials_used': 0,
              'authenticated_requests': 0,
              'order_submissions': 0,
              'live_submission': 'physically_absent',
              'historical_admission_credit': 0,
          }
          (root / 'OBSERVER_VERIFICATION.json').write_text(
              json.dumps(verification, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(verification, indent=2, sort_keys=True))
          PY

      - name: Verify capability boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3')
          core_forbidden = {
              'requests', 'urllib', 'httpx', 'aiohttp', 'web3',
              'py_clob_client', 'eth_account', 'websocket', 'websockets',
          }
          privileged = {'web3', 'py_clob_client', 'eth_account', 'websocket', 'websockets'}
          forbidden_tokens = {
              'create_order', 'post_order', 'submit_order', 'private_key',
              'api_secret', 'sign_transaction', 'poly_api_key', 'poly_signature',
              'poly_passphrase', 'poly_address',
          }
          def imports_for(path: Path) -> set[str]:
              tree = ast.parse(path.read_text())
              imports = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.update(alias.name.split('.')[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.add(node.module.split('.')[0])
              return imports

          for path in sorted((root / 'source').glob('*.py')):
              imports = imports_for(path)
              assert not (imports & core_forbidden), (path, imports & core_forbidden)
              lowered = path.read_text().lower()
              for token in forbidden_tokens:
                  assert token not in lowered, (path, token)

          collector_paths = sorted((root / 'collector').glob('*.py'))
          all_collector_imports = set().union(*(imports_for(path) for path in collector_paths))
          assert 'requests' in all_collector_imports
          assert not (all_collector_imports & privileged), all_collector_imports & privileged
          for path in collector_paths:
              lowered = path.read_text().lower()
              for token in forbidden_tokens:
                  assert token not in lowered, (path, token)
          public_text = (root / 'collector/public_collector.py').read_text()
          assert 'https://gamma-api.polymarket.com' in public_text
          assert 'https://clob.polymarket.com' in public_text
          assert 'parsed.path == "/books"' in public_text
          assert 'parsed.path.startswith("/markets/slug/")' in public_text
          cli_text = (root / 'collector/cli.py').read_text()
          assert 'capture' in cli_text and 'resolve' in cli_text
          PY

      - name: Build deterministic observer checkpoint
        shell: bash
        run: |
          set -euo pipefail
          root=ci_payload/digital-surface-live-readiness/late-favorite-btc-only-v3
          mkdir -p btc-only-v3-observer-checkpoint
          cp "$root/CANDIDATE_SPEC.json" btc-only-v3-observer-checkpoint/
          cp "$root/FREEZE_MANIFEST.json" btc-only-v3-observer-checkpoint/
          cp "$root/CAPTURE_POLICY.json" btc-only-v3-observer-checkpoint/
          cp "$root/CAPTURE_FREEZE_MANIFEST.json" btc-only-v3-observer-checkpoint/
          cp "$root/OBSERVER_VERIFICATION.json" btc-only-v3-observer-checkpoint/
          cp "$root/source/late_favorite_v3.py" btc-only-v3-observer-checkpoint/
          cp "$root/source/capture_policy.py" btc-only-v3-observer-checkpoint/
          cp "$root/collector/public_collector.py" btc-only-v3-observer-checkpoint/
          cp "$root/collector/resolution.py" btc-only-v3-observer-checkpoint/
          cp "$root/collector/cli.py" btc-only-v3-observer-checkpoint/
          (cd btc-only-v3-observer-checkpoint && sha256sum * > SHA256SUMS)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf btc-only-v3-observer-checkpoint-v2.tar.gz btc-only-v3-observer-checkpoint
          sha256sum btc-only-v3-observer-checkpoint-v2.tar.gz > btc-only-v3-observer-checkpoint-v2.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: btc-only-v3-observer-checkpoint-v2
          path: |
            btc-only-v3-observer-checkpoint/
            btc-only-v3-observer-checkpoint-v2.tar.gz
            btc-only-v3-observer-checkpoint-v2.tar.gz.sha256
          compression-level: 0
          retention-days: 30
