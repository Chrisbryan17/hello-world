name: Late Favorite Fee-Field Regression

on:
  push:
    branches: [digital-surface-live-readiness-20260725]
    paths:
      - .github/workflows/late-favorite-fee-field-regression.yml
      - ci_payload/digital-surface-live-readiness/late-favorite-repro-source/late_favorite_transfer.py
      - ci_payload/digital-surface-live-readiness/late-favorite-repro-source/test_fee_field_regression.py
  pull_request:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/late-favorite-fee-field-regression.yml
      - ci_payload/digital-surface-live-readiness/late-favorite-repro-source/late_favorite_transfer.py
      - ci_payload/digital-surface-live-readiness/late-favorite-repro-source/test_fee_field_regression.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fee-field-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal pinned stack
        run: python -m pip install pandas==2.2.3 huggingface_hub==0.33.4 pytest==8.3.5
      - name: Compile source and regression test
        run: |
          python -m py_compile \
            ci_payload/digital-surface-live-readiness/late-favorite-repro-source/late_favorite_transfer.py \
            ci_payload/digital-surface-live-readiness/late-favorite-repro-source/test_fee_field_regression.py
      - name: Run fee-field regression
        env:
          PYTHONPATH: ci_payload/digital-surface-live-readiness/late-favorite-repro-source
        run: pytest -q ci_payload/digital-surface-live-readiness/late-favorite-repro-source/test_fee_field_regression.py
