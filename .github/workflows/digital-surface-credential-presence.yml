name: Digital Surface Credential Presence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-credential-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOME_API_KEY: ${{ secrets.DOME_API_KEY }}
      POLYNODE_API_KEY: ${{ secrets.POLYNODE_API_KEY }}
      SEQ_KEY: ${{ secrets.SEQ_KEY }}
      SEQUENCE_API_KEY: ${{ secrets.SEQUENCE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p credential-presence
          python - <<'PY'
          import json, os
          from pathlib import Path
          names=['DOME_API_KEY','POLYNODE_API_KEY','SEQ_KEY','SEQUENCE_API_KEY']
          result={name:bool(os.environ.get(name)) for name in names}
          Path('credential-presence/presence.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: digital-surface-credential-presence
          path: credential-presence/presence.json
          retention-days: 7
