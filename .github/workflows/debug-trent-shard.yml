name: Debug Trent BTC5m Shard V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debug-trent-shard.yml
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet huggingface_hub hf_xet pyarrow pandas numpy
      - name: Capture small v2 shard
        run: |
          set +e
          python scripts/compact_trent_btc5m_v2.py --shard 0 --shards 64 --workers 8 > trent_debug_v2.log 2>&1
          echo $? > trent_debug_v2.status
          cat trent_debug_v2.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-debug-v2
          path: |
            trent_debug_v2.log
            trent_debug_v2.status
            trent_btc5m_compact_v2_shard_*.parquet
            trent_btc5m_manifest_v2_shard_*.json
          if-no-files-found: warn
          retention-days: 1
