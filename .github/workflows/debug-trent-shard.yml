name: Diagnose Trent BTC5m Coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debug-trent-shard.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet huggingface_hub hf_xet pyarrow pandas numpy
      - run: python scripts/diagnose_trent_btc5m.py --shard 0 --shards 64
      - uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-coverage-diagnostic
          path: |
            trent_coverage_diagnostic.json
            trent_coverage_diagnostic.csv
          retention-days: 1
