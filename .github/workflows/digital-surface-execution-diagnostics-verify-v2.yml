name: Verify Digital Surface Execution Diagnostics v2

on:
  push:
    branches: [digital-surface-live-readiness-20260725]
    paths:
      - .github/workflows/digital-surface-execution-diagnostics-verify-v2.yml
  pull_request:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/digital-surface-execution-diagnostics-verify-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_ARTIFACT_ID: '8615107471'
  DIAGNOSTIC_ARTIFACT_ID: '8617727219'
  BASELINE_ZIP_SHA256: '479a25e235841d94077b3d2df070c8ed46bb736c7ebd8f9f1bde8016198a9c39'
  DIAGNOSTIC_ZIP_SHA256: '80a442cded15e26703c401e197a53db28ae59b61efa6dcb808a0d65ead961293'

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 pyarrow==19.0.1 numpy==2.2.6

      - name: Download immutable artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "baseline:${BASELINE_ARTIFACT_ID}" "diagnostic:${DIAGNOSTIC_ARTIFACT_ID}"; do
            name=${pair%%:*}; id=${pair##*:}
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${name}.zip"
            mkdir "${name}" && unzip -q "${name}.zip" -d "${name}"
          done
          echo "${BASELINE_ZIP_SHA256}  baseline.zip" | sha256sum -c -
          echo "${DIAGNOSTIC_ZIP_SHA256}  diagnostic.zip" | sha256sum -c -

      - name: Verify semantic invariance and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from collections import Counter
          from pathlib import Path
          import numpy as np
          import pandas as pd

          baseline = Path('baseline/artifacts/digital-surface-arbitrage')
          current = Path('diagnostic/artifacts/digital-surface-execution-diagnostics')
          left = pd.read_parquet(baseline / 'candidate_ledger.parquet')
          right = pd.read_parquet(current / 'candidate_ledger.parquet')
          assert left.shape == right.shape
          assert left.columns.tolist() == right.columns.tolist()

          numeric_report = {}
          for column in left.columns:
              if pd.api.types.is_numeric_dtype(left[column]):
                  a = left[column].to_numpy(dtype=float)
                  b = right[column].to_numpy(dtype=float)
                  finite = np.isfinite(a) & np.isfinite(b)
                  max_abs = float(np.max(np.abs(a[finite] - b[finite]))) if finite.any() else 0.0
                  numeric_report[column] = max_abs
                  assert np.allclose(a, b, rtol=0.0, atol=1e-12, equal_nan=True), (column, max_abs)
              else:
                  assert left[column].fillna('<NA>').astype(str).equals(right[column].fillna('<NA>').astype(str)), column

          exact_files = ['execution_ledger.parquet', 'fold_results.csv', 'admission.json']
          for name in exact_files:
              assert (baseline / name).read_bytes() == (current / name).read_bytes(), name

          rows = list(csv.DictReader((current / 'execution_failure_attribution.csv').open()))
          reasons = Counter(row['reason'] for row in rows)
          expected = Counter({
              'insufficient_post_arrival_tape': 186,
              'ask_above_limit': 114,
              'missing_post_arrival_book': 110,
              'filled': 34,
              'insufficient_displayed_depth': 4,
          })
          assert len(rows) == 448
          assert reasons == expected, (reasons, expected)

          internal = json.loads((current / 'SHA256SUMS.json').read_text())
          for name, wanted in internal.items():
              got = hashlib.sha256((current / name).read_bytes()).hexdigest()
              assert got == wanted, (name, got, wanted)

          sidecar = Path('diagnostic/digital-surface-execution-diagnostics-v1.tar.gz.sha256').read_text().split()[0]
          tar_sha = hashlib.sha256(Path('diagnostic/digital-surface-execution-diagnostics-v1.tar.gz').read_bytes()).hexdigest()
          assert tar_sha == sidecar

          result = {
              'candidate_semantics_equal_at_1e-12': True,
              'maximum_numeric_difference': max(numeric_report.values(), default=0.0),
              'numeric_column_max_abs_differences': numeric_report,
              'exact_downstream_files': exact_files,
              'reason_counts': dict(expected),
              'internal_checksums_verified': len(internal),
              'diagnostic_tar_sha256': tar_sha,
              'live_mode': 'disabled',
          }
          Path('DIAGNOSTIC_ARTIFACT_VERIFICATION_V2.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: digital-surface-execution-diagnostic-verification-v2
          path: DIAGNOSTIC_ARTIFACT_VERIFICATION_V2.json
          retention-days: 30
