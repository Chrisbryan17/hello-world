name: Digital Surface Trading Tools CI

on:
  push:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/digital-surface-trading-tools.yml
      - ci_payload/inventory_kinzik_current.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-trading-tools.yml
      - ci_payload/inventory_kinzik_current.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  inventory-kinzik-current:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas==2.2.3 pyarrow==19.0.1 requests==2.32.3
      - name: Pin current raw repository and inspect files
        shell: bash
        run: |
          set -o pipefail
          python ci_payload/inventory_kinzik_current.py 2>&1 | tee kinzik-current-inventory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinzik-current-source-inventory
          path: |
            kinzik-current-inventory.json
            kinzik-current-inventory.log
          if-no-files-found: warn
          retention-days: 30
