name: Digital Surface Trading Tools CI

on:
  push:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/digital-surface-trading-tools.yml
      - ci_payload/diagnose_obadiaha_semantics.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-trading-tools.yml
      - ci_payload/diagnose_obadiaha_semantics.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose-obadiaha:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas==2.2.3 pyarrow==19.0.1 requests==2.32.3 numpy==2.2.6
      - name: Verify resolution joins and token orientation
        shell: bash
        run: |
          set -o pipefail
          python ci_payload/diagnose_obadiaha_semantics.py 2>&1 | tee obadiaha-semantics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obadiaha-semantics
          path: |
            obadiaha-semantics.json
            obadiaha-semantics.log
          if-no-files-found: warn
          retention-days: 30
