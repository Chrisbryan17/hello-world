name: Digital Surface Trading Tools CI

on:
  push:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/digital-surface-trading-tools.yml
      - ci_payload/digital-surface-hybrid-update-v2/**
      - ci_payload/digital-surface-provenance-fix/**
      - ci_payload/digital-surface-gamma-closed-fix/**
      - ci_payload/digital-surface-final-recovered/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-trading-tools.yml
      - ci_payload/digital-surface-hybrid-update-v2/**
      - ci_payload/digital-surface-provenance-fix/**
      - ci_payload/digital-surface-gamma-closed-fix/**
      - ci_payload/digital-surface-final-recovered/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '17'
  PYTHONUNBUFFERED: '1'

jobs:
  verify-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified base source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface/chunk-* > digital-surface-execution-snapshot.tar.gz.b64
          base64 --decode digital-surface-execution-snapshot.tar.gz.b64 > digital-surface-execution-snapshot.tar.gz
          echo 'e2a181ac3966e7bb1f786c4fab854294ae96449dc19c7a51bb83814728ec1330  digital-surface-execution-snapshot.tar.gz' | sha256sum -c -
          mkdir trading-tools
          tar -xzf digital-surface-execution-snapshot.tar.gz -C trading-tools

      - name: Overlay and verify hybrid adapter update
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface-hybrid-update-v2/chunk-* > hybrid-branch-update.tar.gz.b64
          base64 --decode hybrid-branch-update.tar.gz.b64 > hybrid-branch-update.tar.gz
          echo '80579a870ad40bc8a8dc0c1062780d7402860af7ecc5003c1571dc708d239682  hybrid-branch-update.tar.gz' | sha256sum -c -
          tar -xzf hybrid-branch-update.tar.gz -C trading-tools
          test -f trading-tools/research/digital_surface/obadiaha_source_manifest.json

      - name: Overlay and verify LFS provenance correction
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface-provenance-fix/chunk-* > hybrid-provenance-fix.tar.gz.b64
          base64 --decode hybrid-provenance-fix.tar.gz.b64 > hybrid-provenance-fix.tar.gz
          echo 'bf6fa8ca218ac41d1e0749d9c628563d0f1d3fafb9082de7317e05c5152b8d3e  hybrid-provenance-fix.tar.gz' | sha256sum -c -
          tar -xzf hybrid-provenance-fix.tar.gz -C trading-tools

      - name: Overlay and verify historical Gamma lookup correction
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface-gamma-closed-fix/chunk-* > gamma-closed-fix.tar.gz.b64
          base64 --decode gamma-closed-fix.tar.gz.b64 > gamma-closed-fix.tar.gz
          echo 'e6ee3e8d4fdb101cf599593a4a1abf855935f90e68257d9293a7167ae48c8fb9  gamma-closed-fix.tar.gz' | sha256sum -c -
          tar -xzf gamma-closed-fix.tar.gz -C trading-tools

      - name: Overlay and verify final recovered 29-test source
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface-final-recovered/chunk-* > final-recovered-source.tar.gz.b64
          base64 --decode final-recovered-source.tar.gz.b64 > final-recovered-source.tar.gz
          echo 'ac3cf5f39d71facc9a1e4bc39a9ab05c64ae5ae5137889b74cab64bb540f9a15  final-recovered-source.tar.gz' | sha256sum -c -
          tar -xzf final-recovered-source.tar.gz -C trading-tools
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '.github/workflows/digital-surface-arbitrage.yml': '79a5b17999aca8bf9c2a41dff88db418ee3ed06de0c817523f692b68e9e7ff60',
              'research/digital_surface/data.py': '439e56c236f95352c62a707b35b2747429d067711c3c6c9ff6955e6018f2f939',
              'research/digital_surface/obadiaha_source_manifest.json': 'cd6941ea34f6f19477e99be1628f83d7a24a2922a645538ebfe5cae9d3e2c289',
              'research/digital_surface/run_research.py': '83a36e1a90934e42ce5a7d3c5373e97ac47b902717c69526856ec8ae94e658aa',
              'research/digital_surface/validation.py': 'e9cada082c5e7c680ce3ac6f48dbac45367c492fe8e7a24cebeeaddc86fff39c',
              'tests/digital_surface/test_data_adapter.py': '7ec353b287ef61bb1a3d11dc0a31da40dff218ac3552afa8b772355335a82efc',
              'tests/digital_surface/test_integration.py': 'cf2bfa0eca57810bb83569f9519ada694b541b5bafb3e609802787a3445dbc9d',
              'tests/digital_surface/test_validation.py': '7a4ef5a43e4b2999e3eabc53eb930088f0f514f2adefdba6a5a7207b952bea3b',
          }
          root = Path('trading-tools')
          for name, want in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert got == want, (name, got, want)
          print(f'verified {len(expected)} recovered plaintext files')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache immutable hybrid source
        uses: actions/cache@v4
        with:
          path: trading-tools/.cache/digital-surface
          key: digital-surface-hybrid-obadiaha-11793901-kinzik-eb4e9fc7-v3

      - name: Install pinned research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1 pyarrow==19.0.1 requests==2.32.3 pytest==8.3.5 tabulate==0.9.0

      - name: Compile and run complete verified suite
        working-directory: trading-tools
        env:
          PYTHONPATH: '.'
        run: |
          python -m compileall -q research/digital_surface tests/digital_surface
          pytest tests/digital_surface -q

      - name: Run six-block cross-source rolling-origin research
        id: research
        continue-on-error: true
        working-directory: trading-tools
        env:
          PYTHONPATH: '.'
        shell: bash
        run: |
          set -o pipefail
          python -m research.digital_surface.run_research --cache-dir .cache/digital-surface --output-dir artifacts/digital-surface-arbitrage 2>&1 | tee digital-surface-arbitrage.log

      - name: Diagnose immutable Obadiaha interval alignment after gate failure
        if: steps.research.outcome == 'failure'
        working-directory: trading-tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/digital-surface-arbitrage
          python - <<'PY'
          import json, re
          from pathlib import Path
          import numpy as np, pandas as pd
          root=Path('.cache/digital-surface/obadiaha')
          mk=pd.read_parquet(root/'markets/all.parquet')
          rs=pd.read_parquet(root/'resolutions/all.parquet')
          sp=pd.concat([pd.read_parquet(root/f'crypto_prices/{d:%Y-%m-%d}.parquet',columns=['timestamp','asset','open','close']) for d in pd.date_range('2026-03-06','2026-03-19')],ignore_index=True)
          w=mk.copy(); w['asset']=w.asset.astype(str).str.upper(); w=w[(w.asset=='BTC')&w.market_type.isin(['crypto_5m','crypto_15m'])].copy()
          w['start_dt']=pd.to_datetime(w.start_time,utc=True); w['end_dt']=pd.to_datetime(w.end_time,utc=True)
          w=w[w.start_dt.between(pd.Timestamp('2026-03-06',tz='UTC'),pd.Timestamp('2026-03-20',tz='UTC'),inclusive='left')]
          rs=rs[['condition_id','outcome']].copy(); rs['condition_id']=rs.condition_id.astype(str); w['condition_id']=w.condition_id.astype(str); w=w.merge(rs,on='condition_id')
          sp=sp[sp.asset.astype(str).str.upper().eq('BTC')].copy(); sp['dt']=pd.to_datetime(sp.timestamp,utc=True); sp=sp.sort_values('dt').drop_duplicates('dt',keep='last')
          def epoch(v):
              z=re.search(r'(\d{10,13})(?:\D*)$',str(v))
              if not z:return pd.NaT
              n=int(z.group(1));return pd.to_datetime(n,unit='ms' if n>10**11 else 's',utc=True)
          w['slug_dt']=w.slug.map(epoch); w['market_id_dt']=w.market_id.map(epoch); w['duration_s']=w.market_type.map({'crypto_5m':300,'crypto_15m':900})
          def vals(times,col,minus_ms=0):
              q=pd.DataFrame({'i':np.arange(len(w)),'q':pd.to_datetime(times,utc=True)-pd.Timedelta(milliseconds=minus_ms)}).dropna().sort_values('q')
              r=pd.merge_asof(q,sp[['dt',col]].sort_values('dt'),left_on='q',right_on='dt',direction='backward',tolerance=pd.Timedelta('2min')).sort_values('i')
              out=np.full(len(w),np.nan); out[r.i.astype(int)]=r[col].to_numpy(); return out
          starts={'field':w.start_dt,'slug':w.slug_dt,'market_id':w.market_id_dt}
          ends={'field':w.end_dt,'start_plus_duration':w.start_dt+pd.to_timedelta(w.duration_s,unit='s'),'slug_plus_duration':w.slug_dt+pd.to_timedelta(w.duration_s,unit='s'),'market_id_plus_duration':w.market_id_dt+pd.to_timedelta(w.duration_s,unit='s')}
          recorded=w.outcome.eq('Up').to_numpy(); results=[]
          for sn,st in starts.items():
              strike=vals(st,'open')
              for en,et in ends.items():
                  for mode,minus in [('before',1),('at_timestamp',0)]:
                      final=vals(et,'close',minus); ok=np.isfinite(strike)&np.isfinite(final); pred=final>=strike
                      results.append({'start':sn,'end':en,'close':mode,'agreement':float((pred[ok]==recorded[ok]).mean()) if ok.any() else None,'valid':int(ok.sum())})
          results.sort(key=lambda x:-(x['agreement'] or -1))
          deltas={c:(w[c]-w.start_dt).dt.total_seconds().describe().to_dict() for c in ['slug_dt','market_id_dt']}
          sample=w[['market_id','slug','market_type','start_time','end_time','outcome']].head(30).astype(str).to_dict('records')
          payload={'market_columns':mk.columns.tolist(),'resolution_columns':rs.columns.tolist(),'rows':len(w),'outcomes':w.outcome.value_counts().to_dict(),'timestamp_deltas_seconds':deltas,'results':results,'sample':sample}
          out=Path('artifacts/digital-surface-arbitrage/ALIGNMENT_DIAGNOSTIC.json'); out.write_text(json.dumps(payload,indent=2,default=str)); print(json.dumps(payload,indent=2,default=str))
          PY

      - name: Verify every generated artifact checksum
        if: steps.research.outcome == 'success'
        working-directory: trading-tools
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('artifacts/digital-surface-arbitrage')
          expected=json.loads((root/'SHA256SUMS.json').read_text())
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
          assert (root/'REPORT.md').exists() and (root/'admission.json').exists() and (root/'SOURCE_AUDIT.json').exists()
          print(f'verified {len(expected)} internal checksums')
          PY

      - name: Show result or diagnostic
        if: always()
        working-directory: trading-tools
        run: |
          cat artifacts/digital-surface-arbitrage/admission.json || true
          cat artifacts/digital-surface-arbitrage/ALIGNMENT_DIAGNOSTIC.json || true
          tail -300 digital-surface-arbitrage.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-hybrid-final
          path: |
            trading-tools/artifacts/digital-surface-arbitrage/
            trading-tools/digital-surface-arbitrage.log
            digital-surface-execution-snapshot.tar.gz
            hybrid-branch-update.tar.gz
            hybrid-provenance-fix.tar.gz
            gamma-closed-fix.tar.gz
            final-recovered-source.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce untouched research success
        if: steps.research.outcome == 'failure'
        run: exit 1
