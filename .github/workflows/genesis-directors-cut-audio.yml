name: Genesis Directors Cut Audio

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/genesis-directors-cut-audio.yml
      - scripts/generate_genesis_directors_audio.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out generator
        uses: actions/checkout@v4

      - name: Install native audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng fluidsynth fluid-soundfont-gm ffmpeg

      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile numpy mido

      - name: Download Kokoro model files
        run: |
          wget -q --show-progress https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          wget -q --show-progress https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Generate British narration and orchestral MIDI
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_genesis_directors_audio.py 2>&1 | tee generation.log

      - name: Render orchestral score
        shell: bash
        run: |
          set -euo pipefail
          sf="$(find /usr/share/sounds -type f \( -iname 'FluidR3_GM.sf2' -o -iname 'default-GM.sf2' -o -iname '*.sf2' \) | head -n 1)"
          test -n "$sf"
          echo "Using soundfont: $sf"
          fluidsynth -ni "$sf" genesis-directors-audio/score.mid \
            -F genesis-directors-audio/orchestral_score_raw.wav -r 48000 -g 0.62
          ffmpeg -y -v error -i genesis-directors-audio/orchestral_score_raw.wav \
            -af "highpass=f=30,lowpass=f=16500,acompressor=threshold=-18dB:ratio=2.2:attack=40:release=500:makeup=1.5,aecho=0.80:0.88:110|230|470:0.11|0.075|0.04,loudnorm=I=-21:LRA=10:TP=-3" \
            -ar 48000 -ac 2 -c:a pcm_s24le genesis-directors-audio/orchestral_score.wav
          rm genesis-directors-audio/orchestral_score_raw.wav

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find genesis-directors-audio/narration -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 10
          python - <<'PY'
          import json, pathlib, soundfile as sf
          root = pathlib.Path('genesis-directors-audio')
          manifest = json.loads((root/'manifest.json').read_text())
          assert manifest['scene_count'] == 10
          assert manifest['actual_voice'].startswith('bm_') or manifest['actual_voice'] == 'am_michael'
          for wav in sorted((root/'narration').glob('*.wav')):
              info = sf.info(wav)
              assert info.channels == 1
              assert info.frames > 0
          score = sf.info(root/'orchestral_score.wav')
          assert score.channels == 2 and score.samplerate == 48000 and score.frames > 0
          print(json.dumps({
              'voice': manifest['actual_voice'],
              'narration_seconds': manifest['total_narration_seconds'],
              'film_seconds': manifest['total_duration_seconds'],
              'score_seconds': score.duration,
          }, indent=2))
          PY
          zip -r -9 genesis-directors-cut-audio.zip genesis-directors-audio >/dev/null
          unzip -t genesis-directors-cut-audio.zip
          sha256sum genesis-directors-cut-audio.zip > genesis-directors-cut-audio.zip.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-directors-cut-audio-diagnostics
          path: generation.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload verified audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: genesis-directors-cut-audio
          path: |
            genesis-directors-cut-audio.zip
            genesis-directors-cut-audio.zip.sha256
            genesis-directors-audio/manifest.json
          if-no-files-found: error
          retention-days: 1
