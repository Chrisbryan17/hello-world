name: Inspect Aliplayer BTC5m Footer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pyarrow requests
      - name: Read Parquet footer with explicit HTTP ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct, time
          import requests
          import pyarrow.parquet as pq

          START_MS = 1775001600000 + 88000
          END_MS = 1775606400000 + 252000
          FILES = {
              'orderbook': {
                  'url': 'https://huggingface.co/datasets/aliplayer1/polymarket-crypto-updown/resolve/refs%2Fconvert%2Fparquet/orderbook/train/0205.parquet',
                  'timestamp': 'ts_ms',
                  'columns': ['ts_ms','market_id','token_id','outcome','best_bid','best_ask','best_bid_size','best_ask_size'],
              },
              'ticks': {
                  'url': 'https://huggingface.co/datasets/aliplayer1/polymarket-crypto-updown/resolve/refs%2Fconvert%2Fparquet/ticks/train/0203.parquet',
                  'timestamp': 'timestamp_ms',
                  'columns': ['market_id','timestamp_ms','token_id','outcome','side','price','size_usdc','tx_hash','block_number','log_index','source','spot_price_usdt','spot_price_ts_ms'],
              },
          }
          session = requests.Session()
          session.headers.update({'User-Agent': 'parquet-footer-audit/1.0'})

          def ranged(url, start, end):
              headers = {'Range': f'bytes={start}-{end}'}
              for attempt in range(8):
                  response = session.get(url, headers=headers, stream=True, timeout=(60, 180), allow_redirects=True)
                  if response.status_code == 206:
                      payload = response.content
                      response.close()
                      return payload, response.headers
                  status = response.status_code
                  response.close()
                  if status in {429, 500, 502, 503, 504}:
                      time.sleep(min(60, 2 ** attempt))
                      continue
                  raise RuntimeError(f'range unsupported or failed: status={status} range={headers["Range"]}')
              raise RuntimeError(f'range request exhausted retries: {url}')

          result = {}
          for name, spec in FILES.items():
              _, first_headers = ranged(spec['url'], 0, 0)
              content_range = first_headers.get('Content-Range', '')
              if '/' not in content_range:
                  raise RuntimeError(f'missing Content-Range for {name}: {first_headers}')
              file_size = int(content_range.rsplit('/', 1)[1])
              tail, _ = ranged(spec['url'], file_size - 8, file_size - 1)
              if len(tail) != 8 or tail[-4:] != b'PAR1':
                  raise RuntimeError(f'invalid Parquet tail for {name}: {tail!r}')
              metadata_length = struct.unpack('<I', tail[:4])[0]
              metadata_start = file_size - metadata_length - 8
              footer, _ = ranged(spec['url'], metadata_start, file_size - 1)
              sparse = Path(f'{name}-metadata-only.parquet')
              with sparse.open('wb') as handle:
                  handle.write(b'PAR1')
                  handle.truncate(file_size)
                  handle.seek(metadata_start)
                  handle.write(footer)
              parquet = pq.ParquetFile(sparse)
              schema_names = parquet.schema.names
              ts_index = schema_names.index(spec['timestamp'])
              required_indices = [schema_names.index(column) for column in spec['columns']]
              selected_groups = []
              for index in range(parquet.metadata.num_row_groups):
                  row_group = parquet.metadata.row_group(index)
                  ts_stats = row_group.column(ts_index).statistics
                  min_ts = None if ts_stats is None else int(ts_stats.min)
                  max_ts = None if ts_stats is None else int(ts_stats.max)
                  overlaps = max_ts is None or min_ts is None or (max_ts >= START_MS and min_ts < END_MS)
                  if not overlaps:
                      continue
                  chunk_ranges = []
                  for column_index in required_indices:
                      column = row_group.column(column_index)
                      offsets = [value for value in (column.dictionary_page_offset, column.data_page_offset) if value is not None and value >= 0]
                      if not offsets:
                          raise RuntimeError(f'no page offset: file={name} row_group={index} column={schema_names[column_index]}')
                      start = min(offsets)
                      end = start + int(column.total_compressed_size)
                      chunk_ranges.append({
                          'column': schema_names[column_index],
                          'start': int(start),
                          'end_exclusive': int(end),
                          'compressed_size': int(column.total_compressed_size),
                      })
                  selected_groups.append({
                      'index': index,
                      'num_rows': int(row_group.num_rows),
                      'min_timestamp': min_ts,
                      'max_timestamp': max_ts,
                      'chunk_ranges': chunk_ranges,
                  })
              result[name] = {
                  'url': spec['url'],
                  'file_size': file_size,
                  'metadata_length': metadata_length,
                  'metadata_start': metadata_start,
                  'num_rows': parquet.metadata.num_rows,
                  'num_row_groups': parquet.metadata.num_row_groups,
                  'schema_names': schema_names,
                  'selected_columns': spec['columns'],
                  'frozen_global_start_ms': START_MS,
                  'frozen_global_end_ms_exclusive': END_MS,
                  'selected_row_groups': selected_groups,
              }
              print(name, 'file_size', file_size, 'all_groups', parquet.metadata.num_row_groups, 'selected_groups', len(selected_groups))
              sparse.unlink()
          Path('aliplayer-btc5m-footer-ranges.json').write_text(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aliplayer-btc5m-footer-ranges
          path: aliplayer-btc5m-footer-ranges.json
          retention-days: 1
          if-no-files-found: error
