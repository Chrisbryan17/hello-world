name: Digital Surface Full Chainlink Source Audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-chainlink-full-audit.yml
      - scripts/digital_surface_chainlink_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache resumable Chainlink page snapshot
        uses: actions/cache@v4
        with:
          path: .cache/digital-surface-chainlink-audit
          key: digital-surface-chainlink-pages-march-2026-v2

      - name: Install pinned audit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.3 \
            pyarrow==19.0.1 \
            requests==2.32.3 \
            'httpx[http2]==0.28.1'

      - name: Compile audit implementation
        run: python -m compileall -q scripts/digital_surface_chainlink_audit.py

      - name: Reconstruct and audit every official Chainlink boundary
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p chainlink-audit
          python scripts/digital_surface_chainlink_audit.py \
            --cache-dir .cache/digital-surface-chainlink-audit \
            --output-dir chainlink-audit \
            2>&1 | tee chainlink-audit/audit.log

      - name: Verify internal artifact hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('chainlink-audit')
          sums = root / 'SHA256SUMS.json'
          if not sums.exists():
              print('SHA256SUMS.json absent; preserving failure evidence')
              raise SystemExit(0)
          expected = json.loads(sums.read_text())
          for name, want in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert got == want, (name, got, want)
          print(f'verified {len(expected)} internal files')
          PY

      - name: Show source decision
        if: always()
        run: |
          cat chainlink-audit/preflight.json || true
          cat chainlink-audit/chainlink_source_decision.json || true
          tail -200 chainlink-audit/audit.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-full-chainlink-source-audit
          path: chainlink-audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce source audit gate
        if: steps.audit.outcome == 'failure'
        run: exit 1
