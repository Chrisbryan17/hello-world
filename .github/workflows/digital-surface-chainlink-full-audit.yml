name: Digital Surface Full Chainlink Source Audit

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/digital-surface-chainlink-full-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache resumable Chainlink page snapshot
        uses: actions/cache@v4
        with:
          path: .cache/digital-surface-chainlink-audit
          key: digital-surface-chainlink-pages-march-2026-v1
      - name: Install pinned audit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 pyarrow==19.0.1 requests==2.32.3 'httpx[http2]==0.28.1'
      - name: Reconstruct official Chainlink boundary snapshot and audit every contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import hashlib
          import json
          import math
          import os
          import re
          import time
          from pathlib import Path

          import httpx
          import pandas as pd
          import requests

          REPO = 'obadiaha/polymarket-crypto-5m-15m'
          REVISION = '11793901f0ac89c5a6c51123a6ccd29a3aaf8f4c'
          SOURCE_FILES = {
              'markets/all.parquet': 1269925,
              'resolutions/all.parquet': 1264422,
          }
          CACHE = Path('.cache/digital-surface-chainlink-audit')
          DATA = CACHE / 'data'
          PAGE_CACHE = CACHE / 'pages.json'
          OUT = Path('chainlink-audit')
          DATA.mkdir(parents=True, exist_ok=True)
          OUT.mkdir(parents=True, exist_ok=True)

          def sha256_bytes(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()

          def download_pinned(relative: str, expected_size: int) -> Path:
              target = DATA / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              part = target.with_suffix(target.suffix + '.part')
              if target.exists() and target.stat().st_size == expected_size:
                  return target
              url = f'https://huggingface.co/datasets/{REPO}/resolve/{REVISION}/{relative}'
              last = None
              for attempt in range(8):
                  offset = part.stat().st_size if part.exists() else 0
                  headers = {'Range': f'bytes={offset}-'} if offset else {}
                  try:
                      with requests.get(url, headers=headers, stream=True, timeout=300) as response:
                          response.raise_for_status()
                          mode = 'ab' if offset and response.status_code == 206 else 'wb'
                          with part.open(mode) as handle:
                              for block in response.iter_content(1 << 20):
                                  if block:
                                      handle.write(block)
                      if part.stat().st_size == expected_size:
                          part.replace(target)
                          return target
                      last = RuntimeError(f'incomplete {relative}: {part.stat().st_size}/{expected_size}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 ** attempt, 15))
              raise RuntimeError(f'failed pinned download {relative}') from last

          source_paths = {name: download_pinned(name, size) for name, size in SOURCE_FILES.items()}
          source_manifest = {
              'repo': REPO,
              'revision': REVISION,
              'files': {
                  name: {
                      'bytes': path.stat().st_size,
                      'sha256': sha256_file(path),
                  }
                  for name, path in source_paths.items()
              },
          }
          (OUT / 'immutable_source_manifest.json').write_text(json.dumps(source_manifest, indent=2))

          markets = pd.read_parquet(source_paths['markets/all.parquet'])
          resolutions = pd.read_parquet(source_paths['resolutions/all.parquet'])
          work = markets.copy()
          work['asset'] = work['asset'].astype(str).str.upper()
          work = work[(work['asset'] == 'BTC') & work['market_type'].isin(['crypto_5m', 'crypto_15m'])].copy()
          work['start_dt'] = pd.to_datetime(work['start_time'], utc=True)
          work = work[work['start_dt'].between(
              pd.Timestamp('2026-03-06', tz='UTC'),
              pd.Timestamp('2026-03-20', tz='UTC'),
              inclusive='left',
          )].copy()
          work['condition_id'] = work['condition_id'].astype(str)
          resolutions = resolutions[['condition_id', 'outcome']].copy()
          resolutions['condition_id'] = resolutions['condition_id'].astype(str)
          work = work.merge(resolutions, on='condition_id', how='inner', validate='one_to_one')
          work['start_epoch'] = work['slug'].astype(str).str.extract(r'(\d{10})(?:\D*)$')[0].astype('int64')
          work['duration_s'] = work['market_type'].map({'crypto_5m': 300, 'crypto_15m': 900}).astype('int64')
          work['end_epoch'] = work['start_epoch'] + work['duration_s']
          work['next_slug'] = [
              f"btc-updown-{'5m' if kind == 'crypto_5m' else '15m'}-{end}"
              for kind, end in zip(work['market_type'], work['end_epoch'])
          ]
          if work.empty:
              raise RuntimeError('no BTC 5m/15m contracts in immutable window')

          slugs = sorted(set(work['slug'].astype(str)) | set(work['next_slug'].astype(str)))
          existing = {}
          if PAGE_CACHE.exists():
              try:
                  existing = json.loads(PAGE_CACHE.read_text())
              except Exception:
                  existing = {}

          ptb_patterns = [
              re.compile(r'opening \\"Price to Beat\\" of \\$([0-9,]+(?:\.[0-9]+)?)', re.I),
              re.compile(r'opening "Price to Beat" of \$([0-9,]+(?:\.[0-9]+)?)', re.I),
              re.compile(r'Price to Beat.{0,80}?\$([0-9,]+(?:\.[0-9]+)?)', re.I | re.S),
          ]
          outcome_patterns = [
              re.compile(r'final outcome was \\"(Up|Down)\\"', re.I),
              re.compile(r'final outcome was "(Up|Down)"', re.I),
              re.compile(r'100% for \\"(Up|Down)\\"', re.I),
              re.compile(r'100% for "(Up|Down)"', re.I),
          ]

          def parse_page(slug: str, payload: bytes, status: int, final_url: str) -> dict:
              text = payload.decode('utf-8', 'replace')
              ptb = None
              for pattern in ptb_patterns:
                  match = pattern.search(text)
                  if match:
                      ptb = float(match.group(1).replace(',', ''))
                      break
              page_outcome = None
              for pattern in outcome_patterns:
                  match = pattern.search(text)
                  if match:
                      page_outcome = match.group(1).title()
                      break
              return {
                  'slug': slug,
                  'url': final_url,
                  'status': status,
                  'bytes': len(payload),
                  'html_sha256': sha256_bytes(payload),
                  'price_to_beat': ptb,
                  'page_outcome': page_outcome,
                  'fetched_at_utc': pd.Timestamp.now(tz='UTC').isoformat(),
              }

          async def fetch_all():
              pending = [slug for slug in slugs if not (
                  slug in existing
                  and existing[slug].get('status') == 200
                  and isinstance(existing[slug].get('price_to_beat'), (int, float))
                  and existing[slug].get('html_sha256')
              )]
              print(f'contracts={len(work)} unique_pages={len(slugs)} cached={len(slugs)-len(pending)} pending={len(pending)}')
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Accept-Encoding': 'gzip',
                  'Cache-Control': 'no-cache',
              }
              limits = httpx.Limits(max_connections=12, max_keepalive_connections=12)
              timeout = httpx.Timeout(40.0, connect=20.0)
              async with httpx.AsyncClient(http2=True, headers=headers, limits=limits, timeout=timeout, follow_redirects=True) as client:
                  semaphore = asyncio.Semaphore(10)

                  async def fetch_one(slug: str) -> tuple[str, dict]:
                      url = f'https://polymarket.com/event/{slug}'
                      last = None
                      async with semaphore:
                          for attempt in range(8):
                              try:
                                  response = await client.get(url)
                                  if response.status_code == 200:
                                      row = parse_page(slug, response.content, response.status_code, str(response.url))
                                      if row['price_to_beat'] is not None:
                                          return slug, row
                                      last = RuntimeError(f'PTB missing for {slug}')
                                  else:
                                      last = RuntimeError(f'HTTP {response.status_code} for {slug}')
                              except Exception as exc:
                                  last = exc
                              await asyncio.sleep(min(0.5 * (2 ** attempt), 12.0))
                      return slug, {
                          'slug': slug,
                          'url': url,
                          'status': None,
                          'price_to_beat': None,
                          'error': repr(last),
                          'fetched_at_utc': pd.Timestamp.now(tz='UTC').isoformat(),
                      }

                  for offset in range(0, len(pending), 40):
                      batch = pending[offset:offset + 40]
                      rows = await asyncio.gather(*(fetch_one(slug) for slug in batch))
                      for slug, row in rows:
                          existing[slug] = row
                      temporary = PAGE_CACHE.with_suffix('.json.tmp')
                      temporary.write_text(json.dumps(existing, sort_keys=True))
                      temporary.replace(PAGE_CACHE)
                      done = min(offset + len(batch), len(pending))
                      failures = sum(1 for slug in slugs if slug in existing and existing[slug].get('price_to_beat') is None)
                      print(f'page_progress={done}/{len(pending)} failures={failures}', flush=True)
              return existing

          snapshot = asyncio.run(fetch_all())
          rows = [snapshot.get(slug, {'slug': slug, 'price_to_beat': None}) for slug in slugs]
          pages = pd.DataFrame(rows)
          pages['market_type'] = pages['slug'].str.extract(r'btc-updown-(5m|15m)-')[0].map({'5m': 'crypto_5m', '15m': 'crypto_15m'})
          pages['boundary_epoch'] = pages['slug'].str.extract(r'(\d{10})(?:\D*)$')[0].astype('int64')
          pages = pages.sort_values(['market_type', 'boundary_epoch'], kind='mergesort')
          pages.to_parquet(OUT / 'chainlink_ptb_snapshot.parquet', index=False)
          pages.to_csv(OUT / 'chainlink_ptb_snapshot.csv', index=False)

          page_map = pages.set_index('slug')['price_to_beat'].to_dict()
          page_outcome_map = pages.set_index('slug')['page_outcome'].to_dict()
          work['chainlink_open'] = work['slug'].map(page_map)
          work['chainlink_close'] = work['next_slug'].map(page_map)
          work['reconstructed_outcome'] = work.apply(
              lambda row: ('Up' if row['chainlink_close'] >= row['chainlink_open'] else 'Down')
              if pd.notna(row['chainlink_open']) and pd.notna(row['chainlink_close']) else None,
              axis=1,
          )
          work['recorded_outcome'] = work['outcome'].astype(str).str.title()
          work['page_outcome'] = work['slug'].map(page_outcome_map)
          work['direction_match'] = work['reconstructed_outcome'] == work['recorded_outcome']
          work['page_outcome_match'] = work['page_outcome'] == work['recorded_outcome']
          work['chainlink_delta'] = work['chainlink_close'] - work['chainlink_open']

          overlap = (
              pages[pages['market_type'] == 'crypto_5m'][['boundary_epoch', 'price_to_beat']]
              .rename(columns={'price_to_beat': 'ptb_5m'})
              .merge(
                  pages[pages['market_type'] == 'crypto_15m'][['boundary_epoch', 'price_to_beat']]
                  .rename(columns={'price_to_beat': 'ptb_15m'}),
                  on='boundary_epoch',
                  how='inner',
              )
          )
          overlap['absolute_difference'] = (overlap['ptb_5m'] - overlap['ptb_15m']).abs()
          overlap['match_to_cent'] = overlap['absolute_difference'] < 0.005
          overlap.to_csv(OUT / 'horizon_boundary_crosscheck.csv', index=False)

          coverage = float((work['chainlink_open'].notna() & work['chainlink_close'].notna()).mean())
          agreement = float(work.loc[work['chainlink_open'].notna() & work['chainlink_close'].notna(), 'direction_match'].mean())
          page_outcome_coverage = float(work['page_outcome'].notna().mean())
          page_outcome_agreement = float(work.loc[work['page_outcome'].notna(), 'page_outcome_match'].mean())
          overlap_coverage = int(len(overlap))
          overlap_agreement = float(overlap['match_to_cent'].mean()) if len(overlap) else float('nan')

          by_horizon = {}
          for horizon, group in work.groupby('market_type'):
              valid = group['chainlink_open'].notna() & group['chainlink_close'].notna()
              by_horizon[horizon] = {
                  'contracts': int(len(group)),
                  'coverage': float(valid.mean()),
                  'agreement': float(group.loc[valid, 'direction_match'].mean()),
                  'page_outcome_coverage': float(group['page_outcome'].notna().mean()),
                  'page_outcome_agreement': float(group.loc[group['page_outcome'].notna(), 'page_outcome_match'].mean()),
              }

          decision = {
              'method': 'official Polymarket historical page Price-to-Beat boundary chaining',
              'resolution_source': 'Chainlink BTC/USD data stream',
              'contracts': int(len(work)),
              'unique_pages': int(len(slugs)),
              'coverage': coverage,
              'direction_agreement': agreement,
              'required_agreement': 0.99,
              'page_outcome_coverage': page_outcome_coverage,
              'page_outcome_agreement': page_outcome_agreement,
              'shared_boundary_count': overlap_coverage,
              'shared_boundary_agreement_to_cent': overlap_agreement,
              'by_horizon': by_horizon,
              'gate_passed': bool(
                  coverage == 1.0
                  and agreement >= 0.99
                  and page_outcome_coverage == 1.0
                  and page_outcome_agreement == 1.0
                  and overlap_coverage > 0
                  and overlap_agreement == 1.0
              ),
              'signals_changed': False,
              'thresholds_changed': False,
              'execution_assumptions_changed': False,
              'validation_chronology_changed': False,
              'contracts_filtered': False,
          }
          (OUT / 'chainlink_source_decision.json').write_text(json.dumps(decision, indent=2))
          work.to_parquet(OUT / 'chainlink_resolution_audit.parquet', index=False)
          work.to_csv(OUT / 'chainlink_resolution_audit.csv', index=False)
          work[~work['direction_match']].to_csv(OUT / 'chainlink_direction_mismatches.csv', index=False)
          work[~work['page_outcome_match']].to_csv(OUT / 'page_outcome_mismatches.csv', index=False)

          checksums = {}
          for path in sorted(OUT.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS.json':
                  checksums[path.name] = sha256_file(path)
          (OUT / 'SHA256SUMS.json').write_text(json.dumps(checksums, indent=2, sort_keys=True))
          print(json.dumps(decision, indent=2))
          if not decision['gate_passed']:
              raise SystemExit('official Chainlink source gate did not pass')
          PY
      - name: Verify internal artifact hashes
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('chainlink-audit')
          sums=root/'SHA256SUMS.json'
          if not sums.exists():
              raise SystemExit('missing SHA256SUMS.json')
          expected=json.loads(sums.read_text())
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
          print(f'verified {len(expected)} internal files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-full-chainlink-source-audit
          path: chainlink-audit/
          if-no-files-found: warn
          retention-days: 30
