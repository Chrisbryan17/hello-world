name: Digital Surface Full Chainlink Source Audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/digital-surface-chainlink-full-audit.yml
      - scripts/digital_surface_chainlink_audit.py
      - scripts/digital_surface_chainlink_audit_v2.py
      - scripts/digital_surface_chainlink_audit_v3.py
      - scripts/digital_surface_chainlink_audit_v4.py
      - scripts/digital_surface_chainlink_audit_v5.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache resumable Chainlink boundary snapshot
        uses: actions/cache@v4
        with:
          path: .cache/digital-surface-chainlink-audit
          key: digital-surface-chainlink-gamma-html-march-2026-v2
          restore-keys: |
            digital-surface-chainlink-gamma-march-2026-v1

      - name: Install pinned audit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.3 \
            pyarrow==19.0.1 \
            requests==2.32.3 \
            'httpx[http2]==0.28.1'

      - name: Compile audit implementation
        run: |
          python -m compileall -q \
            scripts/digital_surface_chainlink_audit.py \
            scripts/digital_surface_chainlink_audit_v2.py \
            scripts/digital_surface_chainlink_audit_v3.py \
            scripts/digital_surface_chainlink_audit_v4.py \
            scripts/digital_surface_chainlink_audit_v5.py

      - name: Reconstruct and audit every official Chainlink boundary
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p chainlink-audit
          python scripts/digital_surface_chainlink_audit_v5.py \
            --cache-dir .cache/digital-surface-chainlink-audit \
            --output-dir chainlink-audit \
            2>&1 | tee chainlink-audit/audit.log

      - name: Stabilize and verify internal artifact hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('chainlink-audit')
          if not (root / 'chainlink_source_decision.json').exists():
              print('decision absent; preserving failure evidence')
              raise SystemExit(0)
          checksums = {}
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name not in {'SHA256SUMS.json', 'audit.log'}:
                  checksums[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256SUMS.json').write_text(
              json.dumps(checksums, indent=2, sort_keys=True), encoding='utf-8'
          )
          expected = json.loads((root / 'SHA256SUMS.json').read_text())
          for name, want in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert got == want, (name, got, want)
          print(f'verified {len(expected)} stable internal files')
          PY

      - name: Show source decision
        if: always()
        run: |
          cat chainlink-audit/preflight.json || true
          cat chainlink-audit/chainlink_source_decision.json || true
          tail -200 chainlink-audit/audit.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-full-chainlink-source-audit
          path: chainlink-audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce source audit gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path('chainlink-audit/chainlink_source_decision.json').read_text())
          assert decision['coverage'] == 1.0, decision
          assert decision['direction_agreement'] >= decision['required_agreement'], decision
          assert decision['shared_boundary_agreement_to_cent'] == 1.0, decision
          assert decision['contracts_filtered'] is False, decision
          assert decision['signals_changed'] is False, decision
          assert decision['thresholds_changed'] is False, decision
          assert decision['execution_assumptions_changed'] is False, decision
          assert decision['validation_chronology_changed'] is False, decision
          assert decision['gate_passed'] is True, decision
          print('official Chainlink source gate passed')
          PY
