name: Export CP313 Parquet Wheels

on:
  pull_request:
    branches: [main]
    paths:
      - export-cp313-parquet-wheels-trigger.txt
      - .github/workflows/export-cp313-parquet-wheels.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download binary wheels
        run: |
          mkdir -p wheels
          python -m pip download --only-binary=:all: --dest wheels pyarrow==25.0.0 duckdb
          sha256sum wheels/* > wheels/SHA256SUMS
          ls -lh wheels
      - uses: actions/upload-artifact@v4
        with:
          name: cp313-parquet-wheels
          path: wheels
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
