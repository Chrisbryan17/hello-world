name: Digital Surface Alignment V4

on:
  push:
    branches: [digital-surface-ci-20260724]
    paths: [.github/workflows/digital-surface-alignment-v4.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/digital-surface-alignment-v4.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/digital-surface
          key: digital-surface-hybrid-obadiaha-11793901-kinzik-eb4e9fc7-v3
      - run: python -m pip install pandas==2.2.3 pyarrow==19.0.1 requests==2.32.3 pyyaml==6.0.2
      - name: Execute corrected frozen boundary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, textwrap
          source=Path('.github/workflows/digital-surface-alignment-v3.yml').read_text()
          marker="python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          script=textwrap.dedent(source[start:end])
          old="source['dt']=source.dt.astype('datetime64[ns, UTC]')"
          new="source['dt']=source['dt'].astype('datetime64[ns, UTC]')"
          if old not in script:
              raise RuntimeError('expected diagnostic typo not found')
          script=script.replace(old,new)
          Path('/tmp/alignment_v4.py').write_text(script)
          subprocess.run([sys.executable,'/tmp/alignment_v4.py'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-surface-alignment-v4
          path: alignment-v3.json
          if-no-files-found: error
          retention-days: 14
