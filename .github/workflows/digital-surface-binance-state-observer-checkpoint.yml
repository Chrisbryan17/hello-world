name: Digital Surface Binance State Observer Checkpoint

on:
  push:
    branches: [digital-surface-live-readiness-20260725]
    paths:
      - .github/workflows/digital-surface-binance-state-observer-checkpoint.yml
      - ci_payload/digital-surface-live-readiness/market-state-observer-source/**
  pull_request:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/digital-surface-binance-state-observer-checkpoint.yml
      - ci_payload/digital-surface-live-readiness/market-state-observer-source/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '17'
  PYTHONUNBUFFERED: '1'

jobs:
  verify-binance-state-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct checksum-pinned source
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface/chunk-* > base.b64
          base64 --decode base.b64 > base.tar.gz
          echo 'e2a181ac3966e7bb1f786c4fab854294ae96449dc19c7a51bb83814728ec1330  base.tar.gz' | sha256sum -c -
          mkdir source && tar -xzf base.tar.gz -C source
          cat ci_payload/digital-surface-final-recovered/chunk-* > recovered.b64
          base64 --decode recovered.b64 > recovered.tar.gz
          echo 'ac3cf5f39d71facc9a1e4bc39a9ab05c64ae5ae5137889b74cab64bb540f9a15  recovered.tar.gz' | sha256sum -c -
          tar -xzf recovered.tar.gz -C source
          cp -a ci_payload/digital-surface-official-resolution-patch/. source/
          for patch_file in timestamp-unit-fix.patch full-universe-gate-fix.patch resolved-universe-fix.patch asset-merge-fix.patch; do
            patch -d source -p1 < "ci_payload/digital-surface-official-resolution-patch/${patch_file}"
          done
          echo 'f71f3a653ca58b4bf98609fc29d8ab16f9d031c9ed14906ebe5159f2b0de8eab  ci_payload/digital-surface-live-readiness/execution-diagnostics.patch' | sha256sum -c -
          patch -d source -p1 < ci_payload/digital-surface-live-readiness/execution-diagnostics.patch
          echo '8606cc925aa3b3a6417abb1fba9a11df916cc2b281880978fb6229aa25875be9  ci_payload/digital-surface-live-readiness/book-arrival-model.patch' | sha256sum -c -
          patch -d source -p1 < ci_payload/digital-surface-live-readiness/book-arrival-model.patch
          cp -a ci_payload/digital-surface-live-readiness/shadow-source/. source/
          cp -a ci_payload/digital-surface-live-readiness/prospective-source/. source/
          cp -a ci_payload/digital-surface-live-readiness/observer-source/. source/
          cp -a ci_payload/digital-surface-live-readiness/simulation-source/. source/
          cp -a ci_payload/digital-surface-live-readiness/market-state-source/. source/
          cp -a ci_payload/digital-surface-live-readiness/market-state-observer-source/. source/

          cat > /tmp/state-observer.sha256 <<'EOF'
          157594f006173023f5ee88ee2b1b72f5af3eba431288a448aab86a57bdd1949e  source/research/digital_surface/binance_public.py
          c50d2f58c964e38e2e8a5f30c561cda1ea85c6dbbfc6fa169cca161607874262  source/research/digital_surface/spot_ledger.py
          ead39cd8014cccb0d3036c9d37f292606121a4650bff7429fed873e8417eee10  source/research/digital_surface/public_state_observer.py
          80e91c2d2214260d9bbf6eb7bf0d736d74581de98ed8ac16bcd2f20ab35d6913  source/tests/digital_surface/test_binance_public.py
          f5eeb0c0f5a746f1556c7f4cfe801251327d5b7275edc2af1760a64fd0f9775f  source/tests/digital_surface/test_spot_ledger.py
          9c1eed5c878ba4b351b3bff5528468c49a8b2b8994ac7a9030477e3a97bbaf80  source/tests/digital_surface/test_public_state_observer.py
          EOF
          sed -i 's/^          //' /tmp/state-observer.sha256
          sha256sum -c /tmp/state-observer.sha256
          cp /tmp/state-observer.sha256 source/BINANCE_STATE_OBSERVER_SOURCE_SHA256.txt

      - name: Install pinned test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1 pyarrow==19.0.1 requests==2.32.3 pytest==8.3.5 tabulate==0.9.0

      - name: Compile and pass exactly 73 tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q research/digital_surface tests/digital_surface
          PYTHONPATH=. pytest --collect-only -q tests/digital_surface | tee /tmp/collect.txt
          grep -Eq '^73 tests collected' /tmp/collect.txt
          PYTHONPATH=. pytest tests/digital_surface -q

      - name: Verify prospective boundary selection and state chaining
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          from decimal import Decimal
          from pathlib import Path

          from research.digital_surface.binance_public import BTCMarketState
          from research.digital_surface.market_discovery import GammaMarketRecord
          from research.digital_surface.public_state_observer import observe_public_btc_state
          from research.digital_surface.spot_ledger import SpotStateLedger

          markets = [
              GammaMarketRecord(
                  condition_id='registered-5', slug='btc-updown-5m-1800', question='Bitcoin Up or Down',
                  yes_token_id='yes-5', no_token_id='no-5', duration_seconds=300,
                  open_epoch_seconds=1800, end_date='', tick_size=Decimal('0.01'),
              ),
              GammaMarketRecord(
                  condition_id='registered-15', slug='btc-updown-15m-1800', question='Bitcoin Up or Down',
                  yes_token_id='yes-15', no_token_id='no-15', duration_seconds=900,
                  open_epoch_seconds=1800, end_date='', tick_size=Decimal('0.01'),
              ),
              GammaMarketRecord(
                  condition_id='unregistered', slug='btc-updown-5m-2100', question='Bitcoin Up or Down',
                  yes_token_id='yes-u', no_token_id='no-u', duration_seconds=300,
                  open_epoch_seconds=2100, end_date='', tick_size=Decimal('0.01'),
              ),
          ]
          calls = []
          def collect(boundaries, *, observed_ts_ms):
              calls.append(list(boundaries))
              return BTCMarketState(
                  symbol='BTCUSDT', server_time_ms=5_000, observed_ts_ms=observed_ts_ms,
                  spot=Decimal('100.50'), vol_30s=0.001, vol_120s=0.002,
                  strikes={1_800_000: Decimal('99.00')}, closed_one_second_bars=121,
                  raw_response_sha256={
                      'server_time': 'a'*64,
                      'one_second_klines': 'b'*64,
                      'strike:1800000': 'c'*64,
                  },
              )
          with tempfile.TemporaryDirectory() as directory:
              ledger = SpotStateLedger(Path(directory) / 'btc_state.jsonl')
              summary = observe_public_btc_state(
                  markets,
                  prospective_market_ids={'registered-5', 'registered-15'},
                  prospective_head_sha256='3'*64,
                  ledger=ledger,
                  observed_ts_ms=5_100,
                  policy_sha256='1'*64,
                  source_sha256='2'*64,
                  collect=collect,
              )
              assert calls == [[1_800_000]]
              assert summary['markets_registered'] == 2
              assert summary['markets_skipped_unregistered'] == 1
              assert summary['strike_boundaries'] == [1_800_000]
              assert summary['authenticated_requests'] == 0
              assert summary['order_submissions'] == 0
              assert SpotStateLedger(ledger.path).head_hash == summary['spot_state_head_sha256']

          verified = {}
          for line in Path('BINANCE_STATE_OBSERVER_SOURCE_SHA256.txt').read_text().splitlines():
              wanted, name = line.split(maxsplit=1)
              got = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert got == wanted, (name, got, wanted)
              verified[name] = got
          result = {
              'tests_collected': 73,
              'registered_market_boundaries_only': True,
              'deduplicated_strike_boundaries': True,
              'prospective_head_binding': True,
              'authenticated_requests': 0,
              'order_submissions': 0,
              'live_mode': 'physically_disabled',
              'source_files_verified': verified,
          }
          Path('BINANCE_STATE_OBSERVER_VERIFICATION.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2))
          PY

      - name: Build deterministic source checkpoint
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf digital-surface-binance-state-observer-source-v1.tar.gz \
            research tests BINANCE_STATE_OBSERVER_SOURCE_SHA256.txt BINANCE_STATE_OBSERVER_VERIFICATION.json
          sha256sum digital-surface-binance-state-observer-source-v1.tar.gz > digital-surface-binance-state-observer-source-v1.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: digital-surface-binance-state-observer-checkpoint-v1
          path: |
            source/BINANCE_STATE_OBSERVER_SOURCE_SHA256.txt
            source/BINANCE_STATE_OBSERVER_VERIFICATION.json
            source/digital-surface-binance-state-observer-source-v1.tar.gz
            source/digital-surface-binance-state-observer-source-v1.tar.gz.sha256
          retention-days: 30
