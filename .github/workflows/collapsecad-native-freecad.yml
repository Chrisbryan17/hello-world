name: CollapseCAD Native FreeCAD Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".collapsecad-native-ci/**"
      - ".github/workflows/collapsecad-native-freecad.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-freecad:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out isolated CI branch
        uses: actions/checkout@v4

      - name: Verify and extract engineering payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          source = Path('.collapsecad-native-ci/payload.tar.gz.b64')
          payload = base64.b64decode(source.read_text(), validate=True)
          expected = 'e834a96d0bbb5e4649cd169ecc9d90ac341bf1a34203673ea20395a9559e95cf'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual} != {expected}')
          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              archive.extractall(root, filter='data')
          print(f'payload verified: sha256={actual}')
          PY

      - name: Install checksum-pinned FreeCAD AppImage
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            --output FreeCAD.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.1/FreeCAD_1.1.1-Linux-x86_64-py311.AppImage
          echo 'e200b5a095b00515997e798ee9f9a14b79e4c5166f55d60e2360a9385dc6cffb  FreeCAD.AppImage' \
            | sha256sum --check --strict
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          echo 'Extracted FreeCAD command candidates:'
          find "$PWD/squashfs-root" -maxdepth 5 \
            \( -type f -o -type l \) \
            \( -iname 'freecadcmd' -o -iname 'FreeCADCmd' -o -iname '*freecad*cmd*' \) \
            -print -exec ls -l {} \;
          FREECAD_CMD="$(find "$PWD/squashfs-root" -maxdepth 5 \
            \( -type f -o -type l \) \
            \( -iname 'freecadcmd' -o -iname 'FreeCADCmd' \) \
            -print -quit)"
          test -n "$FREECAD_CMD"
          FREECAD_CMD="$(readlink -f "$FREECAD_CMD")"
          test -x "$FREECAD_CMD"
          echo "FREECAD_CMD=$FREECAD_CMD" >> "$GITHUB_ENV"
          "$FREECAD_CMD" --version

      - name: Generate nine native FreeCAD documents
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH="$PWD/collapsecad_ci/src" \
            "$FREECAD_CMD" collapsecad_ci/scripts/generate_freecad.py

      - name: Reopen and inspect native FreeCAD documents
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH="$PWD/collapsecad_ci/src" \
            "$FREECAD_CMD" collapsecad_ci/scripts/inspect_native_freecad.py
          cat collapsecad_ci/build/native-freecad-manifest.json

      - name: Upload native FreeCAD proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: collapsecad-native-freecad
          path: |
            collapsecad_ci/build/freecad
            collapsecad_ci/build/native-freecad-manifest.json
          if-no-files-found: error
          retention-days: 30
