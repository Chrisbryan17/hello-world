name: Hourly Orderbook Transfer

on:
  push:
    branches: [hourly-orderbook-research-20260723]
    paths:
      - research/hourly_orderbook_transfer.py
      - research/hourly_orderbook_transfer_fixed.py
      - .github/workflows/hourly-orderbook-transfer.yml
  pull_request:
    branches: [main]
    paths:
      - research/hourly_orderbook_transfer.py
      - research/hourly_orderbook_transfer_fixed.py
      - .github/workflows/hourly-orderbook-transfer.yml
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy pyarrow requests tabulate
      - run: python -m py_compile research/hourly_orderbook_transfer.py research/hourly_orderbook_transfer_fixed.py
      - name: Run pinned orderbook replay
        shell: bash
        run: |
          set -o pipefail
          python research/hourly_orderbook_transfer_fixed.py 2>&1 | tee hourly-orderbook-transfer.log
      - name: Show result
        if: always()
        run: |
          cat results/hourly_orderbook_transfer/summary.csv || true
          tail -250 hourly-orderbook-transfer.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-orderbook-transfer
          path: |
            results/hourly_orderbook_transfer/
            hourly-orderbook-transfer.log
          if-no-files-found: warn
          retention-days: 30
