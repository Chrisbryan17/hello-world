name: Minute Four Favorite Backtest

on:
  pull_request:
    branches: [main]
    paths:
      - minute4-favorite-trigger.txt
      - .github/scripts/minute4_favorite_backtest.py
      - .github/workflows/minute4-favorite-backtest.yml
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      PYTHONHASHSEED: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow huggingface_hub hf_xet tabulate
      - name: Run minute-four favorite backtest
        run: python .github/scripts/minute4_favorite_backtest.py
      - name: Archive results
        run: |
          sha256sum minute4-favorite-results/* > minute4-favorite-results/SHA256SUMS
          tar -czf minute4-favorite-results.tar.gz minute4-favorite-results
          ls -lh minute4-favorite-results minute4-favorite-results.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minute4-favorite-results
          path: |
            minute4-favorite-results
            minute4-favorite-results.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
