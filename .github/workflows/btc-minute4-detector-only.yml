name: BTC Minute4 Detector Only Falsification

on:
  pull_request:
    branches: [main]
    paths:
      - research-triggers/btc-minute4-detector-only.txt
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy pyarrow scikit-learn huggingface_hub hf_xet
      - name: Reuse frozen evaluator with detector-only exit
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/btc-minute4-yeet-analysis.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(source) if "cat > /tmp/analyze.py <<'PY'" in l)+1
          end=next(i for i in range(start,len(source)) if source[i].strip()=='PY')
          code='\n'.join((line[10:] if line.startswith('          ') else line) for line in source[start:end])+'\n'
          old="z,_,reason=sim(r,'time',time_exit=295,model_trigger=trig)"
          new="z,_,reason=sim(r,'time',time_exit=None,model_trigger=trig)"
          old2="mm,mtt,mr=sim(r,'time',time_exit=295,model_trigger=trig)"
          new2="mm,mtt,mr=sim(r,'time',time_exit=None,model_trigger=trig)"
          if old not in code or old2 not in code:
              raise RuntimeError('frozen evaluator patch anchors missing')
          code=code.replace(old,new).replace(old2,new2)
          code=code.replace("OUT=Path('btc-minute4-yeet-results')", "OUT=Path('btc-minute4-detector-only-results')")
          Path('/tmp/detector_only.py').write_text(code)
          PY
          python /tmp/detector_only.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-minute4-detector-only-results
          path: btc-minute4-detector-only-results
          retention-days: 2
          if-no-files-found: error
