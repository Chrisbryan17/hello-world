name: BTC Minute4 Export Spot Snapshots

on:
  pull_request:
    branches: [main]
    paths:
      - research-triggers/btc-minute4-export-spot.txt
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy pyarrow scikit-learn huggingface_hub hf_xet requests
      - name: Build causal panel and attach Binance BTC spot/strike features
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/btc-minute4-yeet-analysis.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(source) if "cat > /tmp/analyze.py <<'PY'" in l)+1
          end=next(i for i in range(start,len(source)) if source[i].strip()=='PY')
          code='\n'.join((line[10:] if line.startswith('          ') else line) for line in source[start:end])+'\n'
          code=code.replace("OUT=Path('btc-minute4-yeet-results')", "OUT=Path('btc-minute4-spot-snapshot-export')")
          anchor="# Small theory-led grid; every rule exits before resolution unless data disappear."
          block=r'''
          # Attach causal Binance BTCUSDT one-second features. The market-opening
          # Binance price is a research proxy for the live Chainlink opening strike.
          import io, time, zipfile, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed

          day_start=(base.market_start.min().floor('D')-pd.Timedelta(days=1)).date()
          day_end=(base.market_start.max().ceil('D')+pd.Timedelta(days=1)).date()
          days=pd.date_range(day_start,day_end,freq='D')

          def fetch_day(day):
              ds=day.strftime('%Y-%m-%d')
              url=f'https://data.binance.vision/data/spot/daily/klines/BTCUSDT/1s/BTCUSDT-1s-{ds}.zip'
              for attempt in range(8):
                  response=requests.get(url,timeout=180)
                  if response.status_code==200:
                      try:
                          with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
                              filename=next(n for n in archive.namelist() if n.endswith('.csv'))
                              raw=pd.read_csv(archive.open(filename),header=None,usecols=[0,1],names=['raw_ts','spot'])
                          raw.raw_ts=pd.to_numeric(raw.raw_ts,errors='coerce')
                          raw.spot=pd.to_numeric(raw.spot,errors='coerce')
                          med=float(raw.raw_ts.dropna().median())
                          if med>1e15: raw['ts_ms']=(raw.raw_ts//1000).astype('Int64')
                          elif med>1e12: raw['ts_ms']=raw.raw_ts.astype('Int64')
                          elif med>1e9: raw['ts_ms']=(raw.raw_ts*1000).astype('Int64')
                          else: raise RuntimeError(f'unrecognized timestamp scale {med} {ds}')
                          return raw[['ts_ms','spot']].dropna(),ds
                      except Exception:
                          if attempt==7: raise
                  elif response.status_code==404:
                      return pd.DataFrame(columns=['ts_ms','spot']),ds
                  if response.status_code in {429,500,502,503,504}: time.sleep(min(60,2**attempt)); continue
                  response.raise_for_status()
              raise RuntimeError(f'exhausted Binance retries {ds}')

          parts=[]
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures=[pool.submit(fetch_day,d) for d in days]
              for n,future in enumerate(as_completed(futures),1):
                  frame,ds=future.result(); parts.append(frame)
                  if n%10==0: print('binance days',n,'/',len(futures),flush=True)
          spot=pd.concat(parts,ignore_index=True).drop_duplicates('ts_ms',keep='last').sort_values('ts_ms')
          spot['ts_ms']=spot.ts_ms.astype('int64'); spot['spot']=spot.spot.astype(float)
          logp=np.log(spot.spot.to_numpy(float))
          spot['spot_mom1_bps']=pd.Series(logp).diff(1).to_numpy()*1e4
          spot['spot_mom3_bps']=pd.Series(logp).diff(3).to_numpy()*1e4
          spot['spot_mom5_bps']=pd.Series(logp).diff(5).to_numpy()*1e4
          spot['spot_mom10_bps']=pd.Series(logp).diff(10).to_numpy()*1e4
          one=pd.Series(logp).diff().to_numpy()*1e4
          spot['spot_vol5_bps']=pd.Series(one).rolling(5,min_periods=3).std().to_numpy()
          spot['spot_vol10_bps']=pd.Series(one).rolling(10,min_periods=5).std().to_numpy()
          spot['spot_vol30_bps']=pd.Series(one).rolling(30,min_periods=10).std().to_numpy()

          market_clock=base[['condition_id','market_start','side_up','split']].copy()
          market_clock['start_ms']=(market_clock.market_start.astype('int64')//1_000_000).astype('int64')
          market_clock=market_clock.sort_values('start_ms')
          strikes=pd.merge_asof(market_clock,spot[['ts_ms','spot']].rename(columns={'ts_ms':'strike_ts_ms','spot':'strike'}),left_on='start_ms',right_on='strike_ts_ms',direction='backward',tolerance=2000)
          strikes['strike_age_ms']=strikes.start_ms-strikes.strike_ts_ms

          snap=snap.merge(strikes[['condition_id','start_ms','strike','strike_age_ms']],on='condition_id',how='left')
          snap['abs_ts_ms']=snap.start_ms+snap.t.astype('int64')*1000
          snap=snap.sort_values('abs_ts_ms')
          snap=pd.merge_asof(snap,spot,left_on='abs_ts_ms',right_on='ts_ms',direction='backward',tolerance=1500)
          snap['spot_age_ms']=snap.abs_ts_ms-snap.ts_ms
          sign=np.where(snap.side_up.eq(1),1.0,-1.0)
          snap['signed_spot_distance_bps']=sign*(snap.spot/snap.strike-1.0)*1e4
          for c in ['spot_mom1_bps','spot_mom3_bps','spot_mom5_bps','spot_mom10_bps']:
              snap['signed_'+c]=sign*snap[c]
          snap['spot_distance_per_vol']=snap.signed_spot_distance_bps/(snap.spot_vol10_bps.abs()+0.25)
          snap['spot_market_disagreement']=snap.signed_spot_distance_bps-(snap.current_mid-0.5)*100.0
          snap=snap.sort_values(['market_start','condition_id','t']).reset_index(drop=True)

          entry_spot=(snap.sort_values(['condition_id','t']).drop_duplicates('condition_id',keep='first')
                      [['condition_id','signed_spot_distance_bps','spot_distance_per_vol','signed_spot_mom1_bps','signed_spot_mom5_bps','spot_vol10_bps','strike_age_ms','spot_age_ms']]
                      .rename(columns={c:'entry_'+c for c in ['signed_spot_distance_bps','spot_distance_per_vol','signed_spot_mom1_bps','signed_spot_mom5_bps','spot_vol10_bps','strike_age_ms','spot_age_ms']}))
          base=base.merge(entry_spot,on='condition_id',how='left')
          snap.to_parquet(OUT/'snapshots_spot.parquet',index=False,compression='zstd')
          snap.to_csv(OUT/'snapshots_spot.csv.gz',index=False,compression='gzip')
          base.to_csv(OUT/'market_features_spot.csv',index=False)
          coverage={
              'markets':int(len(base)),
              'snapshot_rows':int(len(snap)),
              'market_strike_coverage':float(base.entry_signed_spot_distance_bps.notna().mean()),
              'snapshot_spot_coverage':float(snap.signed_spot_distance_bps.notna().mean()),
              'date_min':str(base.market_start.min()),
              'date_max':str(base.market_start.max()),
          }
          (OUT/'spot_coverage.json').write_text(json.dumps(coverage,indent=2))
          print(json.dumps(coverage,indent=2),flush=True)
          raise SystemExit(0)
          '''
          if anchor not in code: raise RuntimeError('spot injection anchor missing')
          code=code.replace(anchor,block+'\n'+anchor)
          Path('/tmp/export_spot_snapshots.py').write_text(code)
          PY
          python /tmp/export_spot_snapshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-minute4-spot-snapshot-export
          path: btc-minute4-spot-snapshot-export
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
