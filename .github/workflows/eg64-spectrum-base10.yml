name: EG64 path-spectrum wiring over cubic bases of order 10

on:
  push:
    branches:
      - eg64-cubic-cap-census
    paths:
      - '.github/workflows/eg64-spectrum-base10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_order: 4
            source_count: 1
            candidate_count: 4
          - source_order: 8
            source_count: 5
            candidate_count: 4
          - source_order: 16
            source_count: 4060
            candidate_count: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install nauty
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nauty
          GENG="$(command -v geng || command -v nauty-geng || true)"
          test -n "$GENG"
          echo "GENG=$GENG" >> "$GITHUB_ENV"

      - name: Generate the complete cubic base census of order 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          "$GENG" -q -c -d3 -D3 10 > results/bases-order10.g6
          test "$(wc -l < results/bases-order10.g6)" -eq 19
          python3 -m py_compile \
            eg64-gadget/spectrum_wiring_search.py \
            eg64-gadget/verify_wiring_witness.py

      - name: Search source order ${{ matrix.source_order }}
        id: search
        shell: bash
        run: |
          set -euo pipefail
          order="${{ matrix.source_order }}"
          expected="${{ matrix.source_count }}"
          set +e
          "$GENG" -q -c -d3 -D3 "$order" \
            | python3 eg64-gadget/spectrum_wiring_search.py \
                --base-file results/bases-order10.g6 \
                --order "$order" \
                --expected "$expected" \
                --witness-out "results/witness-${order}.json" \
                > "results/source-${order}.json"
          pipeline=("${PIPESTATUS[@]}")
          set -e
          generator_status="${pipeline[0]}"
          checker_status="${pipeline[1]}"
          if [[ "$checker_status" == "10" ]]; then
            [[ "$generator_status" == "0" || "$generator_status" == "141" ]]
            python3 eg64-gadget/verify_wiring_witness.py \
              "results/witness-${order}.json" \
              --output "results/independent-verification-${order}.json"
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            [[ "$generator_status" == "0" ]]
            [[ "$checker_status" == "0" ]]
            echo "found=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate exhaustive accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          order = int("${{ matrix.source_order }}")
          expected_sources = int("${{ matrix.source_count }}")
          expected_candidates = int("${{ matrix.candidate_count }}")
          result = json.loads(Path(f"results/source-{order}.json").read_text())
          stats = result["stats"]
          assert stats["source_graphs"] == expected_sources
          assert stats["candidate_vertices"] == expected_candidates
          assert stats["base_graphs"] == 19
          witness = result.get("witness")
          if witness is None:
              expected_covered = expected_candidates * 19 * (6 ** 10)
              assert stats["assignments_covered"] == expected_covered, (
                  stats["assignments_covered"], expected_covered
              )
          else:
              verification = Path(f"results/independent-verification-{order}.json")
              assert verification.exists()
              assert json.loads(verification.read_text())["verified"] is True
          audit = {
              "source_commit": os.environ["GITHUB_SHA"],
              "source_order": order,
              "expected_sources": expected_sources,
              "expected_candidates": expected_candidates,
              "result": result,
          }
          Path(f"results/audit-{order}.json").write_text(
              json.dumps(audit, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(audit, sort_keys=True))
          PY
          sha256sum results/* > results/SHA256SUMS

      - name: Upload exact job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg64-spectrum-base10-source-${{ matrix.source_order }}
          path: |
            results/
            eg64-gadget/spectrum_wiring_search.py
            eg64-gadget/verify_wiring_witness.py
          if-no-files-found: error
          retention-days: 90

      - name: Flag an independently verified counterexample
        if: steps.search.outputs.found == '1'
        run: exit 10

  aggregate:
    if: always()
    needs: search
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/download-artifact@v4
        with:
          pattern: eg64-spectrum-base10-source-*
          path: gathered
      - name: Aggregate and verify all source partitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("gathered")
          expected = {4: (1, 4), 8: (5, 4), 16: (4060, 1)}
          records = []
          witnesses = []
          for order, (source_count, candidate_count) in expected.items():
              directory = root / f"eg64-spectrum-base10-source-{order}"
              audit = json.loads((directory / "results" / f"audit-{order}.json").read_text())
              assert audit["expected_sources"] == source_count
              assert audit["expected_candidates"] == candidate_count
              result = audit["result"]
              if result.get("witness") is not None:
                  verification_path = directory / "results" / f"independent-verification-{order}.json"
                  verification = json.loads(verification_path.read_text())
                  assert verification["verified"] is True
                  witnesses.append({"witness": result["witness"], "verification": verification})
              records.append(audit)
          summary = {
              "source_commit": os.environ["GITHUB_SHA"],
              "base_order": 10,
              "base_graphs": 19,
              "source_graphs": sum(value[0] for value in expected.values()),
              "candidate_vertices": sum(value[1] for value in expected.values()),
              "physical_assignments_covered": sum(
                  record["result"]["stats"]["assignments_covered"]
                  for record in records
              ),
              "search_nodes": sum(
                  record["result"]["stats"]["search_nodes"]
                  for record in records
              ),
              "witnesses": witnesses,
              "records": records,
          }
          Path("spectrum-base10-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "source_graphs": summary["source_graphs"],
              "candidate_vertices": summary["candidate_vertices"],
              "physical_assignments_covered": summary["physical_assignments_covered"],
              "witnesses": len(witnesses),
          }))
          if witnesses:
              raise SystemExit(10)
          PY
          sha256sum spectrum-base10-summary.json > spectrum-base10-summary.sha256

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg64-spectrum-base10-complete-${{ github.run_id }}
          path: |
            spectrum-base10-summary.json
            spectrum-base10-summary.sha256
            gathered/
            eg64-gadget/spectrum_wiring_search.py
            eg64-gadget/verify_wiring_witness.py
          if-no-files-found: error
          retention-days: 90
