name: UGMC Push Trigger Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - 'UGMC_PYBULLET_MAIN_TRIGGER*.txt'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish trigger evidence
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = {
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'commit': os.environ['GITHUB_SHA'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'runner': os.environ.get('RUNNER_NAME', ''),
          }
          Path('UGMC_PUSH_DIAGNOSTIC.json').write_text(
              json.dumps(data, indent=2), encoding='utf-8'
          )
          print(json.dumps(data, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UGMC_PUSH_DIAGNOSTIC.json
          git commit -m 'ci: publish UGMC push-trigger diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
