name: CollapseCAD Phase 2B FEM Courier

on:
  pull_request:
    branches:
      - main
    paths:
      - ".collapsecad-phase2b/**"
      - ".github/workflows/collapsecad-phase2b-courier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out isolated courier branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify and extract engineering payload
        shell: bash
        run: |
          set +e
          mkdir -p .collapsecad-phase2b/diagnostics
          python - <<'PY' > .collapsecad-phase2b/diagnostics/extraction.log 2>&1
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          source = Path('.collapsecad-phase2b/payload.tar.xz.b64')
          text = source.read_text()
          canonical_b64 = ''.join(text.split())
          print(f'raw_text_chars={len(text)}')
          print(f'canonical_base64_chars={len(canonical_b64)}')
          payload = base64.b64decode(canonical_b64, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected = '1fee21128f75726df0b3e28cd865afeef2c256f9852f149d8304b7278a34f83e'
          print(f'decoded_bytes={len(payload)}')
          print(f'decoded_sha256={actual}')
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual} != {expected}')

          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:xz') as archive:
              members = archive.getmembers()
              print(f'archive_members={len(members)}')
              for member in members:
                  print(f'member={member.name}')
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              archive.extractall(root)
          print(f'payload verified: sha256={actual}')
          PY
          STATUS=$?
          cat .collapsecad-phase2b/diagnostics/extraction.log
          exit "$STATUS"

      - name: Run regression tests and regenerate sixteen decks
        working-directory: collapsecad-phase2b-courier
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q
          PYTHONPATH=src python scripts/generate_fem_decks.py
          test "$(find build/decks -type f -name '*.inp' | wc -l)" -eq 16

      - name: Install official CalculiX 2.23 executable and compatibility runtime
        working-directory: collapsecad-phase2b-courier
        shell: bash
        run: |
          mkdir -p build build/ccx-runtime build/compat-runtime
          curl --fail --location --retry 5 --retry-delay 3 \
            --output build/ccx_2.23.tar.bz2 https://dhondt.de/ccx_2.23.tar.bz2
          sha256sum build/ccx_2.23.tar.bz2 | tee build/ccx_2.23-download.sha256
          tar -xjf build/ccx_2.23.tar.bz2 -C build/ccx-runtime
          CCX_BIN="$(find "$PWD/build/ccx-runtime" -type f -name 'ccx_2.23*' -perm -111 | head -n 1)"
          test -n "$CCX_BIN"

          curl --fail --location --retry 5 --retry-delay 3 \
            --output build/libgfortran4_7.5.0-3ubuntu1~18.04_amd64.deb \
            https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-7/libgfortran4_7.5.0-3ubuntu1~18.04_amd64.deb
          sha256sum build/libgfortran4_7.5.0-3ubuntu1~18.04_amd64.deb \
            | tee build/libgfortran4-download.sha256
          dpkg-deb -x build/libgfortran4_7.5.0-3ubuntu1~18.04_amd64.deb build/compat-runtime
          COMPAT_LIB="$(find "$PWD/build/compat-runtime" -type f -name 'libgfortran.so.4*' -printf '%h\n' | head -n 1)"
          test -n "$COMPAT_LIB"

          echo "CCX_BIN=$CCX_BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$COMPAT_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$COMPAT_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$CCX_BIN" \
            | tee build/ccx-ldd.txt
          ! grep -q 'not found' build/ccx-ldd.txt
          LD_LIBRARY_PATH="$COMPAT_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$CCX_BIN" -v || true

      - name: Run nonlinear, buckling, floor, racking, and contact suite
        working-directory: collapsecad-phase2b-courier
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python scripts/run_fem_suite.py --ccx "$CCX_BIN" \
            > build/phase2b-run.log 2>&1
          STATUS=$?
          cat build/phase2b-run.log
          exit "$STATUS"

      - name: Upload complete Phase 2B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapsecad-phase2b-fem-evidence
          path: |
            .collapsecad-phase2b/diagnostics
            collapsecad-phase2b-courier/build/decks
            collapsecad-phase2b-courier/build/solver
            collapsecad-phase2b-courier/build/joint-capacity-ledger.json
            collapsecad-phase2b-courier/build/phase2b-run.log
            collapsecad-phase2b-courier/build/ccx_2.23-download.sha256
            collapsecad-phase2b-courier/build/libgfortran4-download.sha256
            collapsecad-phase2b-courier/build/ccx-ldd.txt
          if-no-files-found: error
          retention-days: 30
