name: Inspect Aliplayer BTC5m Files

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet huggingface_hub
      - name: List relevant public dataset files
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          from pathlib import Path
          import json

          repo = 'aliplayer1/polymarket-crypto-updown'
          prefixes = (
              'data/markets',
              'data/orderbook/crypto=BTC/timeframe=5-minute/',
              'data/ticks/crypto=BTC/timeframe=5-minute/',
              'data/spot_prices/',
          )
          api = HfApi()
          rows = []
          for item in api.list_repo_tree(repo_id=repo, repo_type='dataset', recursive=True, expand=True):
              path = getattr(item, 'path', '')
              if path.startswith(prefixes) and not path.endswith('/'):
                  rows.append({
                      'path': path,
                      'size': getattr(item, 'size', None),
                      'blob_id': getattr(item, 'blob_id', None),
                      'lfs': getattr(item, 'lfs', None),
                  })
          rows.sort(key=lambda r: r['path'])
          Path('aliplayer-btc5m-manifest.json').write_text(json.dumps(rows, indent=2, default=str))
          with open('aliplayer-btc5m-manifest.txt', 'w') as f:
              for row in rows:
                  f.write(f"{row['size']}\t{row['path']}\n")
          print('files', len(rows), 'bytes', sum((r['size'] or 0) for r in rows))
          print(Path('aliplayer-btc5m-manifest.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aliplayer-btc5m-manifest
          path: aliplayer-btc5m-manifest.*
          retention-days: 1
          if-no-files-found: error
