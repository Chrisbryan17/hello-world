name: Export Digital Surface Snapshot

on:
  push:
    branches: [digital-surface-ci-20260724]
    paths:
      - .github/workflows/export-digital-surface-snapshot.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-digital-surface-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/digital-surface/chunk-* > digital-surface-execution-snapshot.tar.gz.b64
          base64 --decode digital-surface-execution-snapshot.tar.gz.b64 > digital-surface-execution-snapshot.tar.gz
          echo 'e2a181ac3966e7bb1f786c4fab854294ae96449dc19c7a51bb83814728ec1330  digital-surface-execution-snapshot.tar.gz' | sha256sum -c -
          tar -tzf digital-surface-execution-snapshot.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: digital-surface-execution-snapshot
          path: digital-surface-execution-snapshot.tar.gz
          retention-days: 30
