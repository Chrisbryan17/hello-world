name: Compact Trent BTC5m Sharded

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-trent-btc5m-sharded.yml
      - scripts/compact_trent_btc5m.py
  workflow_dispatch:

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet huggingface_hub hf_xet pyarrow pandas numpy
      - name: Compact deterministic public shard
        run: python scripts/compact_trent_btc5m.py --shard ${{ matrix.shard }} --shards 8 --workers 24
      - uses: actions/upload-artifact@v4
        with:
          name: trent-btc5m-compact-shard-${{ matrix.shard }}
          path: |
            trent_btc5m_compact_shard_*.parquet
            trent_btc5m_manifest_shard_*.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
