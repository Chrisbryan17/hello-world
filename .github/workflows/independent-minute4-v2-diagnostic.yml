name: Inspect Independent BTC Minute4 V2

on:
  pull_request:
    branches: [main]
    paths:
      - tools/inspect_independent_minute4_v2.py
      - tools/inspect_independent_minute4_v2_timing.py
      - .github/workflows/independent-minute4-v2-diagnostic.yml
      - research-triggers/independent-minute4-v2-diagnostic.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas==2.2.3' 'numpy==2.1.3' 'pyarrow==18.1.0' 'huggingface_hub==0.34.4' 'hf_xet==1.1.8'
      - name: Compile diagnostics
        run: |
          python -m py_compile tools/inspect_independent_minute4_v2.py
          python -m py_compile tools/inspect_independent_minute4_v2_timing.py
      - name: Inspect slot selection and legacy loop boundaries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p independent-minute4-v2-diagnostic
          python tools/inspect_independent_minute4_v2.py 2>&1 | tee independent-minute4-v2-diagnostic/run.log
      - name: Measure exact V2 signal-to-entry cadence
        shell: bash
        run: |
          set -o pipefail
          python tools/inspect_independent_minute4_v2_timing.py 2>&1 | tee independent-minute4-v2-diagnostic/timing-run.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-minute4-v2-diagnostic
          path: independent-minute4-v2-diagnostic/
          retention-days: 2
          if-no-files-found: error
