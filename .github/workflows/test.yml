name: test

on:
  push:
    branches: [jamaica-collapsible-container]
  pull_request:
  workflow_dispatch:

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python scripts/build_variants.py --output-dir build/manifests --samples 21
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-manifests
          path: build/manifests
