name: Lean counting-kernel verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lean-ci/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Reject proof placeholders
        working-directory: lean-ci
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' CountingKernel Verify.lean; then
            echo 'Proof placeholder detected.' >&2
            exit 1
          fi

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean-ci
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          leanchecker: false
          nanoda: false

      - name: Report tool versions
        working-directory: lean-ci
        run: |
          set -euo pipefail
          elan --version
          lean --version
          lake --version

      - name: Resolve Lake dependencies
        working-directory: lean-ci
        run: lake update

      - name: Fetch mathlib build cache
        working-directory: lean-ci
        run: lake exe cache get

      - name: Compile theorem library
        working-directory: lean-ci
        run: lake build

      - name: Compile both source modules with warnings as errors
        working-directory: lean-ci
        run: |
          lake env lean -DwarningAsError=true CountingKernel/Bounds.lean
          lake env lean -DwarningAsError=true CountingKernel/Equality.lean

      - name: Print theorem axiom dependencies
        working-directory: lean-ci
        run: lake env lean -DwarningAsError=true Verify.lean

      - name: Kernel-check compiled environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean-ci
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          leanchecker: true
          nanoda: false
