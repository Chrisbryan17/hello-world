name: Lean counting-kernel verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lean-ci/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reject proof placeholders
        working-directory: lean-ci
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' CountingKernel Verify.lean; then
            echo 'Proof placeholder detected.' >&2
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        working-directory: lean-ci
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Resolve Lake dependencies
        working-directory: lean-ci
        run: lake update

      - name: Fetch mathlib build cache
        working-directory: lean-ci
        run: lake exe cache get

      - name: Compile theorem library
        working-directory: lean-ci
        run: lake build

      - name: Print theorem axiom dependencies
        working-directory: lean-ci
        run: lake env lean Verify.lean
